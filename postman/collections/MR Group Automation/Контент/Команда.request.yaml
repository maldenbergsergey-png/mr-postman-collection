$kind: http-request
description: Метод получения данных объектов сущности Участник команды
url: "{{baseUrl}}/content/team"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "items",
        ],
        types: {
          "items": "array",
          "items.*": "object",
          "items.*.image": "string?",
          "items.*.job_title": "string?",
          "items.*.name": "string?",
          "items.*.surname": "string?",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Команда.resources/examples
order: 5000
