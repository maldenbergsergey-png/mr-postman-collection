$kind: http-request
description: Метод получения контента для блока Награды
url: "{{baseUrl}}/content/awards"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |
      // КОНТРАКТЫ МЕТОДА:

      pm.variables.set("schema", {
        required: [
          "items",
          "items.*.awards",
          "items.*.awards.*.title",
          "items.*.year"
        ],
        types: {
          "awards_qty": "integer",
          "items": "array",
          "items.*.awards": "array",
          "items.*.awards.*.description": "string",
          "items.*.awards.*.description_en": "string?",
          "items.*.awards.*.title": "string",
          "items.*.awards.*.title_en": "string?",
          "items.*.year": "integer"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Награды.resources/examples
order: 6000
