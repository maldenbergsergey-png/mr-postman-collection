$kind: http-request
description: Метод получения данных объектов сущности Партнер
url: "{{baseUrl}}/content/partners"
method: GET
headers:
  Accept: application/json
body:
  type: json
  content: ""
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "items",
          "items.*.name",
          "items.*.partners",
        ],
        types: {
          "items": "array",
          "items.*": "object",
          "items.*.name": "string",
          "items.*.partners": "array",
          "items.*.partners.*": "object",
          "items.*.partners.*.image": "string",
          "items.*.partners.*.web_link": "string?",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Партнеры.resources/examples
order: 4000
