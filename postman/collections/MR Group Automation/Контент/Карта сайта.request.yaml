$kind: http-request
description: |
  Получение данных для контентной страницы "Карта сайта"
url: "{{baseUrl}}/content/sitemap"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "sections",
          "sections.*.links",
          "sections.*.links.*.link",
          "sections.*.links.*.text",
          "sections.*.name",
        ],
        types: {
          "sections": "array",
          "sections.*": "object",
          "sections.*.links": "array",
          "sections.*.links.*": "object",
          "sections.*.links.*.link": "string",
          "sections.*.links.*.text": "string",
          "sections.*.name": "string",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Карта сайта.resources/examples
order: 2000
