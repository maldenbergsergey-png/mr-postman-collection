$kind: http-request
description: Метод получения контента для блока История
url: "{{baseUrl}}/content/history"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "items",
          "items.*.year",
        ],
        types: {
          "items": "array",
          "items.*": "object",
          "items.*.description": "string",
          "items.*.description_en": "string?",
          "items.*.image": "string",
          "items.*.title": "string",
          "items.*.title_en": "string?",
          "items.*.year": "integer",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/История.resources/examples
order: 8000
