$kind: http-request
name: Политика обработки ПДн.
description: |
  Получение данных для контентной политики обработки ПДн.
url: "{{baseUrl}}/content/agreement"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "name",
        ],
        types: {
          "description": "string",
          "name": "string",
          "note": "string",
          "title": "string",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Политика обработки ПДн-.resources/examples
order: 1000
