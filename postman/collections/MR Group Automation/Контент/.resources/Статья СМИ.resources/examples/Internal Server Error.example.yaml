$kind: http-example
request:
  url: "{{baseUrl}}/content/media_articles?page=<integer>&limit=<integer>"
  method: GET
  queryParams:
    - key: page
      value: <integer>
      description: Номер страницы для пагинации (по умолчанию = 1)
    - key: limit
      value: <integer>
      description: Количество элементов на странице для пагинации (каждый метод может иметь своё значение по умолчанию)
response:
  statusCode: 500
  statusText: Internal Server Error
  body:
    type: text
    content: ""
order: 3000
