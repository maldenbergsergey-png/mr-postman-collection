  - type: afterResponse
    code: |-
      let json;

      try {
          json = pm.response.json();
      } catch (e) {
          pm.expect.fail("❗ Ответ не является корректным JSON");
      }

      // Проверяем наличие items
      pm.expect(json, "Ответ пустой").to.be.an("object");
      pm.expect(json.items, "В ответе нет items").to.be.an("array");



      // Достаём коды
      const codes = json.items
          .filter(i => i && i.code)   // на всякий случай
          .map(i => i.code);

      pm.expect(codes, "Не найден ни один code в items").to.be.an("array").that.is.not.empty;

      // Сохраняем в окружение (массивом, не строкой!)
      pm.environment.set("bookedRealtyObjects", JSON.stringify(codes));

      console.log(`Забронированные объекты (${codes.length}):`, codes);
    language: text/javascript
