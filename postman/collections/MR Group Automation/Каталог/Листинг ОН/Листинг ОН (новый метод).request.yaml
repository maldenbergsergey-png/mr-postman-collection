$kind: http-request
description: |
  Получение списка ОН с учётом фильтров.
url: "{{baseUrl}}/realty/objects?category={{category}}&page=1&limit=1"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: ids[]
    value: <integer>
    disabled: true
    description: Фильтр по идентификаторам ОН
  - key: ids[]
    value: <integer>
    disabled: true
    description: Фильтр по идентификаторам ОН
  - key: category
    value: "{{category}}"
    description: Фильтр по типу ОН
  - key: page
    value: "1"
    description: Номер страницы для пагинации (по умолчанию = 1)
  - key: limit
    value: "1"
    description: Количество элементов на странице для пагинации (каждый метод может иметь своё значение по умолчанию)
  - key: sort
    value: <string>
    disabled: true
    description: |
      Код способа сортировки (по умолчанию default)\
      Способы сортировки описаны тут - https://wiki.adv.ru/pages/viewpage.action?pageId=273666894
  - key: price_min
    value: <integer>
    disabled: true
    description: Фильтр по мин цене
  - key: price_max
    value: <integer>
    disabled: true
    description: Фильтр по макс цене
  - key: payment_min
    value: <integer>
    disabled: true
    description: Фильтр по мин платежу
  - key: payment_max
    value: <integer>
    disabled: true
    description: Фильтр по макс платежу
  - key: rooms[]
    value: <integer>
    disabled: true
    description: Фильтр по количеству комнат. 0 - студии, 4 - 4 и более
  - key: rooms[]
    value: <integer>
    disabled: true
    description: Фильтр по количеству комнат. 0 - студии, 4 - 4 и более
  - key: release[]
    value: <string>
    disabled: true
    description: Фильтр по сроку сдачи
  - key: release[]
    value: <string>
    disabled: true
    description: Фильтр по сроку сдачи
  - key: area_min
    value: <integer>
    disabled: true
    description: Фильтр по минимальной площади
  - key: area_max
    value: <integer>
    disabled: true
    description: Фильтр по максимальной площади
  - key: place[]
    value: <string>
    disabled: true
    description: Фильтр по станции метро
  - key: place[]
    value: <string>
    disabled: true
    description: Фильтр по станции метро
  - key: project[]
    value: <string>
    disabled: true
    description: Фильтр по коду проектов
  - key: project[]
    value: <string>
    disabled: true
    description: Фильтр по коду проектов
  - key: building[]
    value: <string>
    disabled: true
    description: Фильтр по корпусу
  - key: building[]
    value: <string>
    disabled: true
    description: Фильтр по корпусу
  - key: booked
