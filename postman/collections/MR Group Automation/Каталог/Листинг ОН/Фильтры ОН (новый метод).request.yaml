$kind: http-request
description: |
  Фильтры поиска товаров в ES с учётом фильтров и строки поиска
url: "{{baseUrl}}/realty/filters"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: category
    value: commercials
    disabled: true
    description: Фильтр по типу ОН
  - key: project_code
    value: <string>
    disabled: true
    description: Код проекта (не путать с фильтром по проекту). Параметр передается, если метод вызывается со страницы проекта
  - key: price_min
    value: <integer>
    disabled: true
    description: Фильтр по мин цене
  - key: price_max
    value: <integer>
    disabled: true
    description: Фильтр по макс цене
  - key: payment_min
    value: <integer>
    disabled: true
    description: Фильтр по мин платежу
  - key: payment_max
    value: <integer>
    disabled: true
    description: Фильтр по макс платежу
  - key: rooms[]
    value: <integer>
    disabled: true
    description: Фильтр по количеству комнат. 0 - студии, 4 - 4 и более
  - key: rooms[]
    value: <integer>
    disabled: true
    description: Фильтр по количеству комнат. 0 - студии, 4 - 4 и более
  - key: release[]
    value: <string>
    disabled: true
    description: Фильтр по сроку сдачи
  - key: release[]
    value: <string>
    disabled: true
    description: Фильтр по сроку сдачи
  - key: area_min
    value: <integer>
    disabled: true
    description: Фильтр по минимальной площади
  - key: area_max
    value: <integer>
    disabled: true
    description: Фильтр по максимальной площади
  - key: place[]
    value: <string>
    disabled: true
    description: Фильтр по станции метро
  - key: place[]
    value: <string>
    disabled: true
    description: Фильтр по станции метро
  - key: project[]
    value: <string>
    disabled: true
    description: Фильтр по коду проектов
  - key: project[]
    value: <string>
    disabled: true
    description: Фильтр по коду проектов
  - key: building[]
    value: <string>
    disabled: true
    description: Фильтр по корпусу
  - key: building[]
    value: <string>
    disabled: true
    description: Фильтр по корпусу
  - key: booked
    value: <boolean>
    disabled: true
    description: Фильтр по признаку "Забронирован"
  - key: free
    value: <boolean>
    disabled: true
    description: Фильтр по признаку "Доступен"
  - key: floor_min
    value: <integer>
    disabled: true
    description: Фильтр по минимальному этажу
  - key: floor_max
    value: <integer>
    disabled: true
    description: Фильтр по максимальному этажу
  - key: level_min
    value: <integer>
    disabled: true
    description: Фильтр по минимальному уровню
  - key: level_max
    value: <integer>
    disabled: true
    description: Фильтр по максимальному уровню
  - key: discount
    value: <boolean>
    disabled: true
    description: Фильтр по наличию скидки
  - key: family
    value: <boolean>
    disabled: true
    description: Фильтр по признаку "Семейное"
  - key: ventilation
    value: <boolean>
    disabled: true
    description: Фильтр по признаку "Технологическая вентиляция"
  - key: housing[]
    value: Flat
    disabled: true
    description: Фильтр по типу жилого помещения
  - key: housing[]
    value: Apartment
    disabled: true
    description: Фильтр по типу жилого помещения
  - key: decoration[]
    value: <string>
    disabled: true
    description: Фильтр по типу отделки
  - key: decoration[]
    value: <string>
    disabled: true
    description: Фильтр по типу отделки
  - key: has_kitchen
    value: <boolean>
    disabled: true
    description: Фильтр по наличию кухни
  - key: assignment
    value: <boolean>
    disabled: true
    description: Фильтр по переуступке (пока не используются, история MRSUPERAPP-2954)
  - key: installments
    value: <boolean>
    disabled: true
    description: Фильтр по наличию рассрочки (пока не используются, история MRSUPERAPP-2954)
  - key: private_filter
    value: <boolean>
    disabled: true
    description: Фильтр по признаку MR Private
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("contractJsonSchema", {
        "$ref": "#/definitions/RealtyFilterResponse",
        "definitions": {
          "RealtyFilterResponse": {
            "type": "object",
            "required": [
              "categories",
              "count",
              "filters",
              "projects_count",
              "sorts",
              "typical_objects_count"
            ],
            "properties": {
              "categories": {
                "type": "array",
                "items": {
                  "$ref": "#/definitions/RealtyCategory"
                }
              },
              "count": {
                "$ref": "#/definitions/Count"
              },
              "filters": {
                "type": "array",
                "items": {
                  "anyOf": [
                    {
                      "$ref": "#/definitions/BooleanFilter"
                    },
                    {
                      "$ref": "#/definitions/RealtyRangeFilter"
                    },
                    {
                      "$ref": "#/definitions/RealtySelectFilter"
                    }
                  ]
                }
              },
              "projects_count": {
                "type": "integer",
                "minimum": 0,
                "maximum": 2147483647
              },
              "sorts": {
                "type": "array",
                "items": {
                  "$ref": "#/definitions/Sort"
                }
              },
              "typical_objects_count": {
                "type": "integer",
                "minimum": 0,
                "maximum": 2147483647
              }
            }
          },
          "RealtyCategory": {
            "type": "object",
            "required": [
              "additional_info",
              "available",
              "checked",
              "classes",
              "min_price",
              "name",
              "value"
            ],
            "properties": {
              "additional_info": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "available": {
                "type": "boolean"
              },
              "checked": {
                "type": "boolean"
              },
              "classes": {
                "$ref": "#/definitions/RealtyClassList"
              },
              "min_price": {
                "$ref": "#/definitions/MinPriceNullable"
              },
              "name": {
                "type": "string"
              },
              "value": {
                "$ref": "#/definitions/RealtyObjectType"
              }
            }
          },
          "RealtyClassList": {
            "type": "array",
            "items": {
              "$ref": "#/definitions/RealtyClass"
            }
          },
          "RealtyClass": {
            "type": "object",
            "required": [
              "available",
              "checked",
              "min_price",
              "name",
              "value"
            ],
            "properties": {
              "available": {
                "type": "boolean"
              },
              "checked": {
                "type": "boolean"
              },
              "min_price": {
                "$ref": "#/definitions/MinPriceNullable"
              },
              "name": {
                "type": "string"
              },
              "value": {
                "$ref": "#/definitions/RealtyClassCode"
              }
            }
          },
          "MinPriceNullable": {
            "type": [
              "number",
              "null"
            ]
          },
          "RealtyClassCode": {
            "type": "string",
            "enum": [
              "mr_group",
              "mr_premium",
              "mr_private"
            ]
          },
          "RealtyObjectType": {
            "type": "string",
            "enum": [
              "boxrooms",
              "commercials",
              "flats",
              "ihc",
              "offices",
              "parkings",
              "townhouses"
            ]
          },
          "Count": {
            "type": "integer"
          },
          "BooleanFilter": {
            "type": "object",
            "required": [
              "available",
              "checked",
              "code",
              "name",
              "type"
            ],
            "properties": {
              "available": {
                "type": "boolean"
              },
              "checked": {
                "type": "boolean"
              },
              "code": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "type": {
                "type": "string",
                "enum": [
                  "boolean"
                ]
              }
            }
          },
          "RealtyRangeFilter": {
            "type": "object",
            "required": [
              "code",
              "global_range",
              "name",
              "presets",
              "range",
              "type"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "global_range": {
                "allOf": [
                  {
                    "$ref": "#/definitions/RangeBounds"
                  }
                ]
              },
              "name": {
                "type": "string"
              },
              "presets": {
                "type": "array",
                "items": {
                  "type": "object",
                  "required": [
                    "from",
                    "to"
                  ],
                  "properties": {
                    "from": {
                      "type": [
                        "number",
                        "null"
                      ]
                    },
                    "to": {
                      "type": [
                        "number",
                        "null"
                      ]
                    }
                  }
                }
              },
              "range": {
                "allOf": [
                  {
                    "$ref": "#/definitions/RangeBounds"
                  }
                ]
              },
              "type": {
                "type": "string",
                "enum": [
                  "range"
                ]
              }
            }
          },
          "RangeBounds": {
            "type": "object",
            "required": [
              "max",
              "min"
            ],
            "properties": {
              "max": {
                "type": "number"
              },
              "min": {
                "type": "number"
              }
            }
          },
          "RealtySelectFilter": {
            "type": "object",
            "required": [
              "code",
              "name",
              "type",
              "values"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "type": {
                "type": "string",
                "enum": [
                  "select"
                ]
              },
              "values": {
                "type": "array",
                "items": {
                  "$ref": "#/definitions/RealtyFilterValue"
                }
              }
            }
          },
          "RealtyFilterValue": {
            "type": "object",
            "required": [
              "additional_info",
              "available",
              "checked",
              "name",
              "value"
            ],
            "properties": {
              "additional_info": {
                "anyOf": [
                  {
                    "$ref": "#/definitions/RealtyFilterAdditionalInfoProject"
                  },
                  {
                    "$ref": "#/definitions/RealtyFilterAdditionalInfoBuilding"
                  },
                  {
                    "$ref": "#/definitions/RealtyFilterAdditionalInfoPlace"
                  }
                ]
              },
              "available": {
                "type": "boolean"
              },
              "checked": {
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "value": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  }
                ]
              }
            }
          },
          "RealtyFilterAdditionalInfoProject": {
            "type": "object",
            "required": [
              "class",
              "image",
              "metro_color",
              "metro_distance",
              "metro_line",
              "metro_name",
              "min_price",
              "movement_way",
              "project_id",
              "show_buildings"
            ],
            "properties": {
              "class": {
                "allOf": [
                  {
                    "$ref": "#/definitions/RealtyClassCode"
                  }
                ]
              },
              "image": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "metro_color": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "metro_distance": {
                "type": [
                  "integer",
                  "null"
                ]
              },
              "metro_line": {
                "$ref": "#/definitions/MetroLine"
              },
              "metro_name": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "min_price": {
                "type": [
                  "number",
                  "null"
                ]
              },
              "movement_way": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "project_id": {
                "type": "integer"
              },
              "show_buildings": {
                "type": "boolean"
              }
            }
          },
          "MetroLine": {
            "type": [
              "string",
              "null"
            ]
          },
          "RealtyFilterAdditionalInfoBuilding": {
            "type": "object",
            "required": [
              "project_id",
              "project_name",
              "quarter",
              "released",
              "year"
            ],
            "properties": {
              "project_id": {
                "type": [
                  "integer",
                  "null"
                ]
              },
              "project_name": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "quarter": {
                "type": [
                  "integer",
                  "null"
                ]
              },
              "released": {
                "type": [
                  "boolean",
                  "null"
                ]
              },
              "year": {
                "type": [
                  "string",
                  "null"
                ]
              }
            }
          },
          "RealtyFilterAdditionalInfoPlace": {
            "type": "object",
            "required": [
              "area_id",
              "area_name",
              "metro_color",
              "metro_distance",
              "metro_line",
              "movement_way"
            ],
            "properties": {
              "area_id": {
                "type": [
                  "integer",
                  "null"
                ]
              },
              "area_name": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "metro_color": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "metro_distance": {
                "type": [
                  "integer",
                  "null"
                ]
              },
              "metro_line": {
                "type": [
                  "string",
                  "null"
                ]
              },
              "movement_way": {
                "type": [
                  "string",
                  "null"
                ]
              }
            }
          },
          "Sort": {
            "type": "object",
            "required": [
              "code",
              "name"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "name": {
                "type": "string"
              }
            }
          }
        }
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Фильтры ОН (новый метод).resources/examples
order: 2000
