$kind: http-request
name: "Настройки страницы проекта"
description: |
  Возвращает сведения о конфигурации карточки проекта.
url: "{{baseUrl}}/realty/projects/{{projectCode}}/page-settings"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "additional_data",
          "blocks",
          "blocks.*.code",
          "blocks.*.teaser",
          "blocks.*.title",
          "cta_button",
          "cta_button.active",
          "cta_button.related_project",
          "cta_button.related_project.project",
          "cta_button.related_project.project.code",
          "cta_button.related_project.project.name",
          "cta_button.related_project.title",
          "cta_button.title",
          "slider",
          "slider.autoplay",
          "slider.speed",
          "subtitle",
          "title",
          "use_new_card_design",
        ],
        types: {
          "additional_data": "object?",
          "blocks": "array",
          "blocks.*": "object",
          "blocks.*.code": "string",
          "blocks.*.teaser": "string?",
          "blocks.*.title": "string",
          "cta_button": "object",
          "cta_button.active": "boolean",
          "cta_button.related_project": "object?",
          "cta_button.related_project.project": "object",
          "cta_button.related_project.project.code": "string",
          "cta_button.related_project.project.name": "string",
          "cta_button.related_project.title": "string",
          "cta_button.title": "string",
          "slider": "object",
          "slider.autoplay": "boolean",
          "slider.speed": "integer",
          "subtitle": "string?",
          "title": "string",
          "use_new_card_design": "boolean",
        },
        openPaths: ["additional_data"],
      });
      // Входные данные приходят из предыдущих запросов или задаются вручную
      const required = ["projectCode"];
      const absent = required.filter((n) => !pm.variables.get(n));
      if (absent.length) {
        console.warn("Запрос пропущен: нет значений для " + absent.join(", "));
        pm.execution.skipRequest();
      }

      // КОНТРАКТ ProjectPageSettings
    language: text/javascript
settings: {}
order: 16000
