$kind: http-request
description: |
  Метод возвращает материалы по проекту
url: "{{baseUrl}}/project/{{projectCode}}/booklets"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "items",
          "items.*.file",
          "items.*.image",
          "items.*.title",
        ],
        types: {
          "items": "array",
          "items.*": "object",
          "items.*.file": "string",
          "items.*.image": "string",
          "items.*.title": "string",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Буклеты.resources/examples
order: 2000
