$kind: http-request
name: "Видеопрезентация проекта"
description: |
  Возвращает данные для отображения блока Видеопрезентация проекта.
url: "{{baseUrl}}/realty/projects/{{projectCode}}/video-presentation"
method: GET
headers:
  Accept: application/json
