$kind: http-request
description: Метод возвращает объекты инфраструктуры, категории инфраструктуры и данные проекта для карты
url: "{{baseUrl}}/project/{{projectCode}}/infrastructure"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      // КОНТРАКТЫ МЕТОДА: 

      pm.variables.set("schema", {
        required: [
          "categories",
          "categories.*.icon_app",
          "categories.*.icon_web",
          "categories.*.id",
          "categories.*.name",
          "items",
          "items.*.address",
          "items.*.availabilities",
          "items.*.category_id",
          "items.*.code",
          "items.*.id",
          "items.*.latitude",
          "items.*.longitude",
          "items.*.name",
          "project",
          "project.brandbook",
          "project.business_unit",
          "project.code",
          "project.id",
          "project.image",
          "project.is_countryside",
          "project.is_premium",
          "project.is_private",
          "project.is_promoted",
          "project.metro_stations",
          "project.metro_stations.*.color",
          "project.metro_stations.*.distance",
          "project.metro_stations.*.id",
          "project.metro_stations.*.line",
          "project.metro_stations.*.movement_way",
          "project.metro_stations.*.name",
          "project.name",
          "project.title",
          "project.latitude",
          "project.longitude"
        ],
        types: {
          "categories": "array",
          "categories.*.icon_app": "string",
          "categories.*.icon_web": "string",
          "categories.*.id": "integer",
          "categories.*.name": "string",
          "items": "array",
          "items.*.address": "string",
          "items.*.availabilities": "string?",
          "items.*.category_id": "integer",
          "items.*.code": "string",
          "items.*.id": "integer",
          "items.*.latitude": "number",
          "items.*.longitude": "number",
          "items.*.name": "string",
          "project": "object",
          "project.brandbook": "string",
          "project.business_unit": "string",
          "project.code": "string",
          "project.id": "integer",
          "project.image": "string?",
          "project.is_countryside": "boolean",
          "project.is_premium": "boolean",
          "project.is_private": "boolean",
          "project.is_promoted": "boolean",
          "project.metro_stations": "array",
          "project.metro_stations.*.color": "string?",
          "project.metro_stations.*.distance": "integer?",
          "project.metro_stations.*.id": "integer",
          "project.metro_stations.*.line": "string?",
          "project.metro_stations.*.movement_way": "object?",
          "project.metro_stations.*.movement_way.icon": "string",
          "project.metro_stations.*.movement_way.name": "string",
          "project.metro_stations.*.name": "string",
          "project.name": "string",
          "project.office_class": "object?",
          "project.office_class.code": "string",
          "project.office_class.description": "string?",
          "project.title": "string?",
          "project.latitude": "number",
          "project.longitude": "number"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Объекты инфраструктуры.resources/examples
order: 1000
