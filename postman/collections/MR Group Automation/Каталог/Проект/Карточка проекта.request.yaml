  - type: afterResponse
    code: |
      // === Tests: вытянуть имя проекта и сохранить в окружение ===
      let body;
      try { body = pm.response.json(); }
      catch { throw new Error("Ответ карточки проекта не JSON"); }

      // Универсальный поиск name: корень, data, items[0], [0]
      const pickName = (j) => {
        if (!j) return null;
        if (typeof j.name === "string" && j.name.trim()) return j.name.trim();
        if (j.data && typeof j.data.name === "string" && j.data.name.trim()) return j.data.name.trim();
        if (Array.isArray(j.items) && j.items[0]?.name) return String(j.items[0].name).trim();
        if (Array.isArray(j) && j[0]?.name) return String(j[0].name).trim();
        return null;
      };

      const name = pickName(body);
      pm.test("Карточка проекта содержит name", function () {
        pm.expect(name, "name отсутствует в ответе").to.be.a("string").and.not.empty;
      });

      // Сохраняем имя проекта
      pm.environment.set("projectName", name);

      // (Опционально) сохраняем ещё карту code->name
      const code = body?.code || body?.data?.code || null;
      if (code) {
        let map = {};
        try { map = JSON.parse(pm.environment.get("projectsMap") || "{}"); } catch {_=>{}}
        map[code] = name;
        pm.environment.set("projectsMap", JSON.stringify(map));
      }

      console.log(`✔ projectName="${name}" сохранён для последующего поиска`);
    language: text/javascript
settings: {}
examples: ./.resources/Карточка проекта.resources/examples
order: 6000
