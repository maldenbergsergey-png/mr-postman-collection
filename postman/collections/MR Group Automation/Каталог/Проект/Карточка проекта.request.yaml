          "object_types.*.background_color": "string?",
          "object_types.*.code": "string",
          "object_types.*.description": "string?",
          "object_types.*.discounted_price": "object?",
          "object_types.*.image": "string?",
          "object_types.*.name": "string",
          "object_types.*.price": "number?",

          // object_types.*.discounted_price
          "object_types.*.discounted_price.percentage_discount": "number",
          "object_types.*.discounted_price.price": "number",
