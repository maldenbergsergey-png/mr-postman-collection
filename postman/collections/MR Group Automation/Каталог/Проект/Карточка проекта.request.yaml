  - type: beforeRequest
    code: |
      // КОНТРАКТЫ МЕТОДА:

      pm.variables.set("schema", {
      required: [],
      types: {
          "brandbook": "string",
          "business_unit": "string",
          "code": "string",
          "id": "integer",
          "is_countryside": "boolean",
          "is_private": "boolean",
          "marketing_images": "array",
          "name": "string",
          "title": "string?",
          "air_3d": "string?",
          "alternative_plan": "object?",
          "apartments_count": "integer?",
          "categories": "array",
          "description": "string?",
          "documentation": "string?",
          "external": "boolean",
          "is_completed": "boolean",
          "latitude": "number",
          "logo": "string?",
          "longitude": "number",
          "main_3d": "string?",
          "main_plan": "object?",
          "metro": "object?",
          "metro_distance": "integer?",
          "min_price": "number?",
          "mobile_marketing_images": "array",
          "movement_way": "object?",
          "object_types": "array",
          "queues": "object?",
          "related_project": "object?",
          "view_from_above_plan": "object?",

          // alternative_plan
          "alternative_plan.background_image": "string",
          "alternative_plan.compass_angle": "number?",
          "alternative_plan.floor": "number?",
          "alternative_plan.items_level": "string?",
          "alternative_plan.level": "string",
          "alternative_plan.object_type": "string",
          "alternative_plan.price_table_variant": "string",
          "alternative_plan.svg_markup": "string",
          "alternative_plan.level_plan": "string", //устаревшее название

           //main_plan
          "main_plan.background_image": "string",
          "main_plan.compass_angle": "number?",
          "main_plan.floor": "number?",
          "main_plan.items_level": "string?",
          "main_plan.level": "string",
          "main_plan.object_type": "string",
          "main_plan.price_table_variant": "string",
          "main_plan.svg_markup": "string",
          "main_plan.level_plan": "string", //устаревшее название
          
           //view_from_above_plan
          "view_from_above_plan.background_image": "string",
          "view_from_above_plan.compass_angle": "number?",
          "view_from_above_plan.floor": "number?",
          "view_from_above_plan.items_level": "string?",
          "view_from_above_plan.level": "string",
          "view_from_above_plan.object_type": "string",
          "view_from_above_plan.price_table_variant": "string",
          "view_from_above_plan.svg_markup": "string",
          "view_from_above_plan.level_plan": "string", //устаревшее название

          // categories[*]
          "categories.*.background_color": "string?",
          "categories.*.code": "string?",
          "categories.*.description": "string?",
          "categories.*.image": "string?",
          "categories.*.min_discounted_price": "object?",
          "categories.*.min_meter_price": "number?",
          "categories.*.min_price": "number?",
          "categories.*.name": "string",
          "categories.*.object_count": "integer?",
          "categories.*.show_in": "object",

          // categories.*.min_discounted_price
