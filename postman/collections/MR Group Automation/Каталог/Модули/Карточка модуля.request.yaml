          "project.metro_stations.*.name": "string",
          "project.name": "string",
          "project.office_class": "object?",
          "project.office_class.code": "string",
          "project.office_class.description": "string?",
          "project.title": "string?",
          "queues": "array",
          "queues.*.buildings": "array",
          "queues.*.buildings.*": "object?",
          "queues.*.buildings.*.code": "string",
          "queues.*.buildings.*.compass_angle": "number?",
          "queues.*.buildings.*.deadline": "string?",
          "queues.*.buildings.*.floors_number": "integer?",
          "queues.*.buildings.*.id": "integer",
          "queues.*.buildings.*.name": "string?",
          "queues.*.buildings.*.readiness": "integer?",
          "queues.*.buildings.*.scheme": "string?",
          "queues.*.deadline": "string?",
          "queues.*.id": "integer",
          "queues.*.is_sales_stopped": "boolean",
          "queues.*.marketing_deadline": "string?",
          "queues.*.marketing_name": "string?",
          "queues.*.name": "string?",
          "queues.*.number": "integer?",
          "additional_data": "string?",
          "additional_materials": "array",
          "additional_materials.*.accent_name": "string",
          "additional_materials.*.content_type": "string",
          "additional_materials.*.download_file": "object?",
          "additional_materials.*.download_file.description": "string",
          "additional_materials.*.download_file.src": "string",
          "additional_materials.*.link_3d": "string?",
          "additional_materials.*.mobile_url": "string?",
          "additional_materials.*.secondary_name": "string?",
          "additional_materials.*.site_url": "string?",
          "additional_materials.*.video": "object?",
          "additional_materials.*.video.duration": "integer?",
          "additional_materials.*.video.src": "string",
          "banner_image": "object?",
          "banner_image.description": "string",
          "banner_image.src": "string",
          "banner_image_mobile": "object?",
          "banner_image_mobile.description": "string",
          "banner_image_mobile.src": "string",
          "details": "array",
          "details.*.additional_info": "array|string",
          "details.*.code": "string",
          "details.*.formatted_value": "string?",
          "details.*.icon": "object?",
          "details.*.icon.*": "any",
          "details.*.name": "string",
          "details.*.show_in": "array",
          "details.*.show_in.*": "string",
          "details.*.type": "string",
          "details.*.value": "string",
          "details_title": "string?",
          "page_subtitle": "string?",
          "page_title": "string",
          "show_details": "boolean"
        }
      });
    language: text/javascript
settings: {}
order: 2000
