$kind: http-request
name: "Карточка модуля"
description: |
  Возвращает сведения о модуле проекта по его коду.
url: "{{baseUrl}}/realty/modules/{{moduleCode}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      // Входные данные приходят из предыдущих запросов или задаются вручную
      const required = ["moduleCode"];
      const absent = required.filter((n) => !pm.variables.get(n));
      if (absent.length) {
        console.warn("Запрос пропущен: нет значений для " + absent.join(", "));
        pm.execution.skipRequest();
      }

      // КОНТРАКТ RealtyModule
      pm.variables.set("schema", {
        required: [
          "category",
          "category.code",
          "category.name",
          "code",
          "id",
          "key_calc_params",
          "key_param_variant",
          "project",
          "project.brandbook",
          "project.business_unit",
          "project.code",
          "project.id",
          "project.image",
          "project.is_countryside",
          "project.is_premium",
          "project.is_private",
          "project.is_promoted",
          "project.metro_stations",
          "project.metro_stations.*.color",
          "project.metro_stations.*.distance",
          "project.metro_stations.*.id",
          "project.metro_stations.*.line",
          "project.metro_stations.*.movement_way",
          "project.metro_stations.*.name",
          "project.name",
          "project.title",
          "queues",
          "queues.*.buildings",
          "queues.*.deadline",
          "queues.*.id",
          "queues.*.is_sales_stopped",
          "queues.*.marketing_deadline",
          "queues.*.marketing_name",
          "queues.*.name",
          "queues.*.number",
          "additional_data",
          "additional_materials",
          "additional_materials.*.accent_name",
          "additional_materials.*.content_type",
          "additional_materials.*.download_file",
          "additional_materials.*.link_3d",
          "additional_materials.*.mobile_url",
          "additional_materials.*.secondary_name",
          "additional_materials.*.site_url",
          "additional_materials.*.video",
          "banner_image",
          "banner_image_mobile",
          "details",
          "details.*.additional_info",
          "details.*.code",
          "details.*.formatted_value",
          "details.*.icon",
          "details.*.name",
          "details.*.show_in",
          "details.*.type",
          "details.*.value",
          "details_title",
          "page_subtitle",
          "page_title",
          "show_details"
        ],
        types: {
          "category": "object",
          "category.code": "string",
          "category.name": "string",
          "code": "string",
          "id": "integer",
          "key_calc_params": "object?",
          "key_calc_params.max_area": "number?",
          "key_calc_params.max_discount": "number?",
          "key_calc_params.min_area": "number?",
          "key_calc_params.min_meter_price": "number?",
          "key_calc_params.min_price": "number?",
          "key_calc_params.objects_count": "integer",
          "key_param_variant": "string",
          "project": "object",
          "project.brandbook": "string",
          "project.business_unit": "string",
          "project.code": "string",
          "project.id": "integer",
          "project.image": "string?",
          "project.is_countryside": "boolean",
          "project.is_premium": "boolean",
          "project.is_private": "boolean",
          "project.is_promoted": "boolean",
          "project.metro_stations": "array",
          "project.metro_stations.*.color": "string?",
          "project.metro_stations.*.distance": "integer?",
          "project.metro_stations.*.id": "integer",
          "project.metro_stations.*.line": "string?",
          "project.metro_stations.*.movement_way": "object?",
