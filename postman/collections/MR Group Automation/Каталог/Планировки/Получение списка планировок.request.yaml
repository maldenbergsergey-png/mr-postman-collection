scripts:
  - type: afterResponse
    code: |+
      // Пытаемся распарсить JSON; если не получилось — фиксируем ошибку и прекращаем дальнейшие проверки
      let jsonData;
      try {
          jsonData = pm.response.json();
      } catch (e) {
          pm.test("Ответ является валидным JSON", function () {
              throw new Error("Ответ не является JSON: " + e.message);
          });
          // останавливаем дальнейшее выполнение
          return;
      }

      // Проверяем наличие массива items
      pm.test("Ответ содержит массив items (не пустой)", function () {
          pm.expect(jsonData).to.have.property("items");
          pm.expect(jsonData.items).to.be.an("array");
          pm.expect(jsonData.items.length).to.be.above(0);
      });

      // Берём первый элемент
      const firstItem = Array.isArray(jsonData.items) && jsonData.items.length > 0 ? jsonData.items[0] : null;

      if (!firstItem) {
          console.warn("items пустой — дальнейшие проверки пропущены");
          return;
      }

      // Сохраняем поле typicalObjectId в окружение, если оно есть
      if (firstItem.typicalObjectId) {
          pm.environment.set("typicalObjectId", firstItem.typicalObjectId);
          pm.test("Сохранён typicalObjectId", function () {
              pm.expect(pm.environment.get("typicalObjectId")).to.eql(firstItem.typicalObjectId);
          });
          console.log("typicalObjectId =", firstItem.typicalObjectId);
      } else {
          pm.test("В первом элементе есть поле typicalObjectId", function () {
              throw new Error("Поле 'typicalObjectId' отсутствует в items[0]");
          });
      }

    language: text/javascript
  - type: beforeRequest
    code: |-
      // КОНТРАКТЫ МЕТОДА: 

      pm.variables.set("schema", {
        required: ["items","limit", "page","page_count", "sort"],
        types: {
          "items" : "array",
          "limit" : "integer",
          "page" : "integer",
          "page_count" : "integer",
          "sort" : "object",
      //items[]
      "items.*.3d_layout" : "string?",
      "items.*.apartments_count" : "integer",
      "items.*.building" : "object",
      "items.*.max_area" : "number",
      "items.*.max_floor" : "integer",
      "items.*.min_area" : "number",
      "items.*.min_floor" : "integer",
      "items.*.min_payment" : "number?",
      "items.*.min_price" : "number?",
      "items.*.project" : "object",
      "items.*.rooms_number" : "integer",
      "items.*.technical_layout" : "string",
      "items.*.typicalObjectId" : "string",
      //"items.*.building"{}
      "items.*.building.code" : "string",
      "items.*.building.deadline" : "string",
      "items.*.building.id" : "integer",
      "items.*.building.name" : "string",
      //"items.*.project"{}
      "items.*.project.brandbook" : "string",
      "items.*.project.business_unit" : "string",
      "items.*.project.code" : "string",
      "items.*.project.id" : "integer",
      "items.*.project.image" : "string?",
      "items.*.project.is_private" : "boolean",
      "items.*.project.name" : "string",
      "items.*.project.title" : "string?",
      //sort{}
      "sort.code": "string",
      "sort.name": "string",
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Получение списка планировок.resources/examples
order: 1000
