$kind: http-request
name: "Объекты паркинга корпуса"
description: |
  Возвращает данные для рабочего состояния посадочной страницы паркинга: доступные фильтры,
  список ОН со схемами и пагинацию.
url: "{{baseUrl}}/realty/projects/{{parkingProjectCode}}/buildings/{{parkingBuildingCode}}/parking/objects?page=1&limit=10"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      // Входные данные приходят из предыдущих запросов или задаются вручную
      const required = ["parkingProjectCode", "parkingBuildingCode"];
      const absent = required.filter((n) => !pm.variables.get(n));
      if (absent.length) {
        console.warn("Запрос пропущен: нет значений для " + absent.join(", "));
        pm.execution.skipRequest();
      }

      // КОНТРАКТ ParkingObjectsResponse
      pm.variables.set("schema", {
        required: [
          "count",
          "filters",
          "filters.available_levels",
          "filters.available_types",
          "filters.parking_types",
          "filters.parking_types.*.code",
          "filters.parking_types.*.name",
          "filters.sorts",
          "filters.sorts.*.code",
          "filters.sorts.*.name",
          "items",
          "items.*.area",
          "items.*.booking_type",
          "items.*.building",
          "items.*.building.code",
          "items.*.building.crm_id",
          "items.*.building.id",
          "items.*.building.name",
          "items.*.category",
          "items.*.category.code",
          "items.*.category.id",
          "items.*.category.name",
          "items.*.code",
          "items.*.crm_id",
          "items.*.discount",
          "items.*.floor",
          "items.*.id",
          "items.*.length",
          "items.*.number",
          "items.*.number_on_floor",
          "items.*.parking_types",
          "items.*.plan",
          "items.*.price",
          "items.*.price_disclaimer",
          "items.*.project",
          "items.*.project.brandbook",
          "items.*.project.business_unit",
          "items.*.project.code",
          "items.*.project.id",
          "items.*.project.image",
          "items.*.project.is_countryside",
          "items.*.project.is_premium",
          "items.*.project.is_private",
          "items.*.project.is_promoted",
          "items.*.project.metro_stations",
          "items.*.project.metro_stations.*.color",
          "items.*.project.metro_stations.*.distance",
          "items.*.project.metro_stations.*.id",
          "items.*.project.metro_stations.*.line",
          "items.*.project.metro_stations.*.movement_way",
          "items.*.project.metro_stations.*.name",
          "items.*.project.name",
          "items.*.project.title",
          "items.*.project.description",
          "items.*.project.marketing_image",
          "items.*.status",
          "items.*.status.code",
          "items.*.status.name",
          "items.*.stop_sales",
          "items.*.subtype",
          "items.*.width",
          "limit",
          "page",
          "page_count",
          "sort",
          "sort.code",
          "sort.name"
        ],
        types: {
          "count": "integer",
          "filters": "object",
          "filters.available_levels": "array",
          "filters.available_levels.*": "integer",
          "filters.available_types": "array",
          "filters.available_types.*": "string",
          "filters.parking_types": "array",
          "filters.parking_types.*.code": "string",
          "filters.parking_types.*.name": "string",
          "filters.sorts": "array",
