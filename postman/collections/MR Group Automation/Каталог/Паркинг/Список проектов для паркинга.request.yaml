    language: text/javascript
  - type: afterResponse
    code: |-
      // Сохраняем код проекта с паркингом для следующих запросов; при ошибке значение сбрасываем
      (function () {
        let body = null;
        try { body = pm.response.json(); } catch (e) { body = null; }
        let found;
        try { found = (function (data) { return data.items.map((i) => i.code).find(Boolean); })(body); } catch (e) { found = undefined; }
        if (found !== undefined && found !== null && found !== "") {
          pm.environment.set("parkingProjectCode", String(found));
        } else {
          pm.environment.unset("parkingProjectCode");
        }
      })();
    language: text/javascript
settings: {}
order: 1000
