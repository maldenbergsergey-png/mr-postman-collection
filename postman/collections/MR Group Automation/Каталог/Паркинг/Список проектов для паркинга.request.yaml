$kind: http-request
name: "Список проектов для паркинга"
description: |
  Возвращает список проектов, предназначенных для раздела "Паркинг".
  Метод возвращает только проекты, соответствующие следующим условиям:
    - проект содержит код, оканчивающийся на "_parking";
    - проект активен в разделе "Паркинг" (PROPERTY_PARKING_ACTIVE=true);
    - сортировка проектов выполняется по полю PROPERTY_PARKING_SORT (по возрастанию);
    - учитываются доступные машиноместа (ММ) и кладовые (КЛ).

  Параметр `types` влияет на фильтрацию проектов по наличию ММ и/или КЛ:
    - `parkings` - только проекты с машиноместами;
    - `boxrooms` - только проекты с кладовыми;
    - комбинированный режим (`parkings` + `boxrooms`) - проекты, имеющие машиноместа или кладовые.

  Поля `min_price` и `max_discount` рассчитываются для каждого проекта:
    - `min_price` - минимальная цена среди всех ММ и КЛ проекта, независимо от выбранного фильтра `types`;
    - `max_discount` - максимальная скидка среди всех ММ и КЛ проекта, независимо от выбранного фильтра `types`.

  Дополнительно метод возвращает:
    - `available_types` - массив типов ОН, реально доступных в проекте, используется для фронтенда;
    - другие поля соответствуют структуре ProjectListItem.
url: "{{baseUrl}}/realty/parking/projects"
method: GET
headers:
  Accept: application/json
