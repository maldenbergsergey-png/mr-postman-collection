$kind: http-example
name: |
  Файл презентации. На текущий момент всегда в формате PDF.
request:
  url: "{{baseUrl}}/realty/objects/:code/presentation"
  method: GET
  headers:
    Accept: application/pdf
  pathVariables:
    code: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/pdf
  body:
    type: text
    content: <binary>
order: 1000
