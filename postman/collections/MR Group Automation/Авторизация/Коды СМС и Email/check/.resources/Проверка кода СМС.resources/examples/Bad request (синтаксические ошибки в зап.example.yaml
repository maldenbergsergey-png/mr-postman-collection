$kind: http-example
name: Bad request (синтаксические ошибки в запросе - неверный JSON, нет обязательного поля, недопустимый тип значения)
request:
  url: "{{baseUrl}}/code/check"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "type": "<string>",
        "code": "<integer>",
        "phoneNumber": "<string>",
        "mail": "<string>"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "example": {
          "errors": [
            {
              "detail": "Недопустимый тип значения"
            }
          ]
        }
      }
order: 2000
