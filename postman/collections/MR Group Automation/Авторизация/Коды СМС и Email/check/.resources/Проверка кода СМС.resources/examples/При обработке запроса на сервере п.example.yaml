$kind: http-example
name: |
  При обработке запроса на сервере произошла внутренняя ошибка.

  Возможные коды ошибок:
  - `internal_error` — внутренняя ошибка приложения.
request:
  url: "{{baseUrl}}/code/check"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "type": "<string>",
        "code": "<integer>",
        "phoneNumber": "<string>",
        "mail": "<string>"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 4000
