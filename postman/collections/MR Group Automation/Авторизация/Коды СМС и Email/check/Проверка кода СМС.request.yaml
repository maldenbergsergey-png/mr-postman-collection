$kind: http-request
description: |
  Проверка значения кода подтверждения
url: "{{baseUrl}}/code/check"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
        "type": "sms",
      "mail": "",
        "phoneNumber": "{{authTestPhone}}",
        "code": {{authTestCode}}
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": []});
    language: text/javascript
settings: {}
examples: ./.resources/Проверка кода СМС.resources/examples
order: 1000
