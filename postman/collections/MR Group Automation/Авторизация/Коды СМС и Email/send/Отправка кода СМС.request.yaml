$kind: http-request
description: |
  Отправка кода подтверждения на email или телефон
url: "{{baseUrl}}/code/send"
method: POST
headers:
  - key: Captcha-Token
    value: <string>
    description: Токен, полученный после прохождения проверки пользователя во внешнем сервисе верификации запросов
  - key: Device-Token
    value: <string>
    description: Константное значение, аналог Captcha-Token для моб. приложений для прохождения проверки (временное решение, будет отключено после разработки варианта проверки запросов на отправку роботом для мобильных приложений)
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
        "type": "sms",
      "mail": null,
        "phoneNumber": "{{authTestPhone}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "refresh",
        ],
        types: {
          "refresh": "string",
        },
      });
      // КОНТРАКТ SendCodeResponse
    language: text/javascript
settings: {}
examples: ./.resources/Отправка кода СМС.resources/examples
order: 1000
