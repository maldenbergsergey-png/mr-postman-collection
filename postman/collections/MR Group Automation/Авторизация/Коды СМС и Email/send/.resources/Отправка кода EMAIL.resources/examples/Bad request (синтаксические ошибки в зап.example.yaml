$kind: http-example
name: Bad request (синтаксические ошибки в запросе - неверный JSON, нет обязательного поля, недопустимый тип значения)
request:
  url: "{{baseUrl}}/code/send"
  method: POST
  headers:
    - key: Captcha-Token
      value: <string>
      description: Токен, полученный после прохождения проверки пользователя во внешнем сервисе верификации запросов
    - key: Device-Token
      value: <string>
      description: Константное значение, аналог Captcha-Token для моб. приложений для прохождения проверки (временное решение, будет отключено после разработки варианта проверки запросов на отправку роботом для мобильных приложений)
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "type": "<string>",
        "phoneNumber": "<string>",
        "mail": "<string>"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "example": {
          "errors": [
            {
              "detail": "Недопустимый тип значения"
            }
          ]
        }
      }
order: 3000
