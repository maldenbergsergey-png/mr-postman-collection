$kind: http-request
description: |
  Отправка кода подтверждения на email или телефон
url: "{{baseUrl}}/code/send"
method: POST
headers:
  - key: Captcha-Token
    value: <string>
    description: Токен, полученный после прохождения проверки пользователя во внешнем сервисе верификации запросов
  - key: Device-Token
    value: <string>
    description: Константное значение, аналог Captcha-Token для моб. приложений для прохождения проверки (временное решение, будет отключено после разработки варианта проверки запросов на отправку роботом для мобильных приложений)
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
    "type": "mail",
    "phoneNumber": "+79935905959",
    "mail": "test@mail.ru"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      // КОНТРАКТ SendCodeResponse
      pm.variables.set("schema", {
        required: [
          "refresh"
        ],
        types: {
          "refresh": "string"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Отправка кода EMAIL.resources/examples
order: 2000
