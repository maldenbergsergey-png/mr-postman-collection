$kind: http-request
url: http://stagetest.mr-group.ru:8080/api/v1/jwt
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "payload": {
            "sub": "d75420eb-9a48-465c-a583-291d3b202dbc",
            "iat": 1761660000,
            "exp": 1764252000,
            "user_id": "58",
            "phone_number": "+79951108394",
            "roles": [
                "client"
            ]
        }
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.unset("bearerToken");
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", { rootType: "object", required: ["jwt", "payload"],
        types: { jwt: "string", payload: "object" }, openPaths: ["payload"] });
    language: text/javascript
  - type: afterResponse
    code: |
      const media = (pm.response.headers.get("Content-Type") || "").split(";")[0].trim().toLowerCase();
      if (pm.response.code !== 200 || media !== "application/json") return;
      let data;
      try { data = pm.response.json(); } catch { return; }
      const valid = typeof data?.jwt === "string" && data.jwt.trim().length > 0
        && data.payload !== null && typeof data.payload === "object" && !Array.isArray(data.payload);
      pm.test("Тестовый JWT получен", () => pm.expect(valid).to.be.true);
      if (valid) pm.environment.set("bearerToken", data.jwt);
    language: text/javascript
settings: {}
order: 2000
