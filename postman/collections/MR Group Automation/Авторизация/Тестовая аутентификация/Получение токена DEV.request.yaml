$kind: http-request
url: http://mrsuperapp.dev.adv:8080/api/v1/jwt
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "payload": {
            "sub": "fcde0f7e-9e18-4918-803a-299ee24e8ae4",
            "iat": 1761660000,
            "exp": 1764252000,
            "user_id": "58",
            "phone_number": "+79951108394",
            "roles": [
                "client"
            ]
        }
    }
scripts:
  - type: afterResponse
    code: |
      const jwtToken = pm.response.json().jwt;

      if (!pm.environment.has('bearerToken')) {
          pm.environment.set('bearerToken', jwtToken);
          console.log("Переменная окружения 'bearerToken' создана и значение установлено:", jwtToken);
      } else {
          pm.environment.set('bearerToken', jwtToken);
          console.log("Значение переменной окружения 'bearerToken' обновлено:", jwtToken);
      }
    language: text/javascript
settings: {}
order: 1000
