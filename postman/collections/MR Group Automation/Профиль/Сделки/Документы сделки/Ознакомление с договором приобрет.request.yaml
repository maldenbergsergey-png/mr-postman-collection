$kind: http-request
name: Ознакомление с договором приобретения ОН
description: |
  Метод, который позволяет отправить подтверждение ознакомления с договором в процессе сделки
url: "{{baseUrl}}/purchase/{{idDeal}}/documents/{{documentDeal}}/acceptance"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Нужные значения приходят из предыдущих запросов; без них запрос не отправляется
      const missingInputs__ = ["idDeal", "documentDeal"].filter((n) => !pm.variables.get(n));
      if (missingInputs__.length) {
        console.warn("Запрос пропущен: нет значений для " + missingInputs__.join(", "));
        pm.execution.skipRequest();
      }

      pm.variables.set("responseKind", "none");
    language: text/javascript
settings: {}
examples: ./.resources/Ознакомление с договором приобрет.resources/examples
order: 4000
