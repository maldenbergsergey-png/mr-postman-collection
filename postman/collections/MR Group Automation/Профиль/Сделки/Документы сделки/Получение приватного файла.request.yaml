$kind: http-request
description: |
  Метод возвращает файл из приватного хранилища, предваритально проверяя наличие доступа к файлу
url: "{{baseUrl}}/private-file/{{documentDeal}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Нужные значения приходят из предыдущих запросов; без них запрос не отправляется
      const missingInputs__ = ["documentDeal"].filter((n) => !pm.variables.get(n));
      if (missingInputs__.length) {
        console.warn("Запрос пропущен: нет значений для " + missingInputs__.join(", "));
        pm.execution.skipRequest();
      }

      pm.variables.set("responseKind", "application/octet-stream");
    language: text/javascript
settings: {}
examples: ./.resources/Получение приватного файла.resources/examples
order: 3000
