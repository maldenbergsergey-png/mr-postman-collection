$kind: http-request
description: |
  Метод, который позволяет получить реквизиты документа в сделке
url: "{{baseUrl}}/purchase/{{idDeal}}/documents/{{documentDeal}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |
      // Нужные значения приходят из предыдущих запросов; без них запрос не отправляется
      const missingInputs__ = ["idDeal", "documentDeal"].filter((n) => !pm.variables.get(n));
      if (missingInputs__.length) {
        console.warn("Запрос пропущен: нет значений для " + missingInputs__.join(", "));
        pm.execution.skipRequest();
      }

      // КОНТРАКТЫ МЕТОДА:

      pm.variables.set("schema", {
        required: [
          "attributes",
          "attributes.*.code",
          "attributes.*.extra_value",
          "attributes.*.formatted_value",
          "attributes.*.name",
          "attributes.*.value",
          "document",
          "document.file_id",
          "document.id",
          "document.name",
          "document.number",
          "document.status",
          "document.type"
        ],
        types: {
          "attributes": "array",
          "attributes.*.code": "string",
          "attributes.*.extra_value": "string?",
          "attributes.*.formatted_value": "string",
          "attributes.*.name": "string",
          "attributes.*.value": "integer|number|string",
          "document": "object",
          "document.file_id": "integer?",
          "document.id": "number",
          "document.name": "string",
          "document.number": "string?",
          "document.status": "object?",
          "document.status.code": "string",
          "document.status.name": "string",
          "document.type": "string"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Получение документа по сделке.resources/examples
order: 2000
