$kind: http-request
description: |
  Метод получения списка сделок пользователя
url: "{{baseUrl}}/purchases"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      // Проверяем, что ответ корректный JSON
      let respData;
      try {
          respData = pm.response.json();
      } catch (e) {
          pm.test("Ответ не является корректным JSON", function () {
              pm.expect.fail("Ошибка парсинга JSON");
          });
      }

      // Проверяем наличие массива items
      pm.test("Проверяем, что есть массив items", function () {
          pm.expect(respData).to.have.property("items");
          pm.expect(respData.items).to.be.an("array").that.is.not.empty;
      });

      // Ищем первую сделку, где массив products не пуст
      let validDeal = null;
      if (Array.isArray(respData.items) && respData.items.length > 0) {
          validDeal = respData.items.find(item => 
              Array.isArray(item.products) && item.products.length > 0
          );
      }

      // Проверяем, что нашли подходящую сделку
      pm.test("Проверяем, что есть сделка с непустым products", function () {
          pm.expect(validDeal, "Не найдено ни одной сделки с непустым products").to.not.be.undefined;
      });

      // Сохраняем id подходящей сделки
      if (validDeal) {
          pm.environment.set("idDeal", validDeal.id);
          console.log(`Переменная idDeal сохранена: ${validDeal.id}`);
      } else {
          console.warn("Не найдено ни одной сделки с непустым products — idDeal не сохранена");
      }
    language: text/javascript
