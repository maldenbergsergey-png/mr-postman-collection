$kind: http-request
description: |
  Метод, который позволяет получить данные по сделке в текущем состоянии
url: "{{baseUrl}}/purchase/{{idDeal}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
