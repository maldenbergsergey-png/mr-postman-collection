auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      // Идентификатор ОН сделки нужен методу получения слотов для записи на осмотр
      (function () {
        let card = null;
        try { card = pm.response.json(); } catch (e) { card = null; }
        const productId = card && Array.isArray(card.products) && card.products[0] ? card.products[0].id : undefined;
        if (productId !== undefined && productId !== null) {
          pm.environment.set("dealProductId", String(productId));
        } else {
          pm.environment.unset("dealProductId");
        }
      })();
