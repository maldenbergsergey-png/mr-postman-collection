      pm.variables.set("schema", {
        required: [
          "bills_qty",
          "documents_qty",
          "phase",
          "phase.code",
          "phase.name",
          "phase.number",
          "phase.phases_qty",
          "step",
          "title",
          "status",
          "status.code",
          "status.name",
          "purchase_type",
          "purchase_type.code",
          "purchase_type.title",
          "products",
          "products.*.assignment",
          "products.*.category",
          "products.*.category.*.code",
          "products.*.category.*.name",
          "products.*.code",
          "products.*.crm_id",
          "products.*.floor",
          "products.*.id",
          "products.*.name",
          "products.*.number",
          "products.*.rooms_number",
          "products.*.status",
          "products.*.status.code",
          "products.*.status.name",
          "products.*.title",
          "products.*.area",
          "products.*.contract_price",
