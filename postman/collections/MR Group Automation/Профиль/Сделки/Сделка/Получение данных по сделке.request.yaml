    code: |
      const idDeal = pm.environment.get("idDeal");

      if (!idDeal) {
          pm.expect.fail("Переменная idDeal не найдена. Сначала выполни запрос /api/purchases");
      } else {
          console.log(`Используем idDeal = ${idDeal}`);
      }


