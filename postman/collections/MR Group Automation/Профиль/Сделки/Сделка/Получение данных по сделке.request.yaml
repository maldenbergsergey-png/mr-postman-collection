      const missingInputs__ = ["idDeal"].filter((n) => !pm.variables.get(n));
      if (missingInputs__.length) {
        console.warn("Запрос пропущен: нет значений для " + missingInputs__.join(", "));
        pm.execution.skipRequest();
      }

      const idDeal = pm.environment.get("idDeal");

      if (!idDeal) {
          pm.expect.fail("Переменная idDeal не найдена. Сначала выполни запрос /api/purchases");
      } else {
          console.log(`Используем idDeal = ${idDeal}`);
      }


