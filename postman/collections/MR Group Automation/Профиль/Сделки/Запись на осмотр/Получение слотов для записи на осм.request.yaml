$kind: http-request
name: Получение слотов для записи на осмотр
description: |
  Метод, который позволяет получить список слотов для записи на осмотр ОН
url: "{{baseUrl}}/purchase/{{idDeal}}/schedule/{{dealProductId}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |
      // Нужные значения приходят из предыдущих запросов; без них запрос не отправляется
      const missingInputs__ = ["idDeal", "dealProductId"].filter((n) => !pm.variables.get(n));
      if (missingInputs__.length) {
        console.warn("Запрос пропущен: нет значений для " + missingInputs__.join(", "));
        pm.execution.skipRequest();
      }

      // КОНТРАКТЫ МЕТОДА: Schedule
      pm.variables.set("schema", {
        required: [
          "items",
          "items.*.date",
          "items.*.id"
        ],

        types: {
          "items": "array",
          "items.*.date": "string",
          "items.*.id": "string"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Получение слотов для записи на осм.resources/examples
order: 1000
