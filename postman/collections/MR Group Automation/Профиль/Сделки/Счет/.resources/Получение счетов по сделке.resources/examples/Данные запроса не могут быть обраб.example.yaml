$kind: http-example
name: |-
  Данные запроса не могут быть обработаны.

  Возможные коды ошибок:

  - `unprocessable_entity` — логическая ошибка, из-за которой невозможно произвести операцию над ресурсом.
  - `not_available_time` — запрашиваемое время недоступно
  - `already_created` — запраш
request:
  url: "{{baseUrl}}/purchase/:purchase-id/bills"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    purchase-id: ""
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 6000
