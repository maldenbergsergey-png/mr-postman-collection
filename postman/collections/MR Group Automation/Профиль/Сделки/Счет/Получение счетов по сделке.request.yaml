$kind: http-request
description: |
  Метод, который позволяет получить список счетов по сделке
url: "{{baseUrl}}/purchase/{{idDeal}}/bills"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |
      // Нужные значения приходят из предыдущих запросов; без них запрос не отправляется
      const missingInputs__ = ["idDeal"].filter((n) => !pm.variables.get(n));
      if (missingInputs__.length) {
        console.warn("Запрос пропущен: нет значений для " + missingInputs__.join(", "));
        pm.execution.skipRequest();
      }

      // КОНТРАКТЫ МЕТОДА:

      pm.variables.set("schema", {
        required: [
          "items",
          "items.*.amount",
          "items.*.description",
          "items.*.expiration_dt",
          "items.*.payment_link",
          "items.*.status",
          "items.*.status.code",
          "items.*.status.name"
        ],
        types: {
          "items": "array",
          "items.*.amount": "number",
          "items.*.description": "string",
          "items.*.expiration_dt": "string?",
          "items.*.payment_link": "string?",
          "items.*.status": "object",
          "items.*.status.code": "string",
          "items.*.status.name": "string"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Получение счетов по сделке.resources/examples
order: 1000
