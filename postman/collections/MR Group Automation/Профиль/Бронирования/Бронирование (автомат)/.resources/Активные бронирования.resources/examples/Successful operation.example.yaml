$kind: http-example
request:
  url: "{{baseUrl}}/user/bookings/active"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "product_ids": [
          "<integer>",
          "<integer>"
        ],
        "count": "<integer>"
      }
order: 1000
