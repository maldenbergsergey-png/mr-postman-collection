$kind: http-example
name: |-
  Синтаксическая ошибка в запросе: неверный JSON, нет обязательного поля, недопустимый тип
  значения и т.п.

  Возможные коды ошибок:

  - `invalid_value` — полученное значение не соответствует заданным ограничениям;
  - `syntax_error` — синтаксическая ошибка в за
request:
  url: "{{baseUrl}}/user/favourites/:code"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    code: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 2000
