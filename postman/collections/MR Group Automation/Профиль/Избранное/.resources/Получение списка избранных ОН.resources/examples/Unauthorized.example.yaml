$kind: http-example
request:
  url: "{{baseUrl}}/user/favourites?category=commercials"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: category
      value: commercials
      description: Фильтр по типу ОН
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
