$kind: http-request
name: "Создание оформления сделки"
description: |
  Создаёт оформление сделки по устным бронированию.
  Входные данные: verbalBookingId (идентификатор устной брони) задаётся вручную.
url: "{{baseUrl}}/deal-application"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "verbal_booking_id": {{verbalBookingId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Входные данные приходят из предыдущих запросов или задаются вручную
      const required = ["verbalBookingId"];
      const absent = required.filter((n) => !pm.variables.get(n));
      if (absent.length) {
        console.warn("Запрос пропущен: нет значений для " + absent.join(", "));
        pm.execution.skipRequest();
      }

      // КОНТРАКТ DealApplicationState
      pm.variables.set("schema", {
        required: [
          "booking_date",
          "contract_price",
          "current_step",
          "id",
          "realty_object",
          "realty_object.article",
          "realty_object.id",
          "realty_object.project_name",
          "realty_object.type_title",
          "status"
        ],
        types: {
          "bank_code": "string?",
          "bank_id": "integer?",
          "booking_date": "string",
          "contract_price": "number",
          "crm_deal_id": "string?",
          "current_step": "string",
          "deal_date": "string?",
          "deal_type": "string?",
          "has_debit_account": "boolean?",
          "has_non_rf_citizen": "boolean?",
          "has_proxy": "boolean?",
          "has_underage": "boolean?",
          "id": "integer",
          "manager": "object?",
          "manager.email": "string?",
          "manager.full_name": "string",
          "manager.phone": "string?",
          "offline_reason": "string?",
          "ownership_form": "string?",
          "participants_count": "integer?",
          "payment_form": "string?",
          "realty_object": "object",
          "realty_object.area": "number?",
          "realty_object.article": "string",
          "realty_object.building": "string?",
          "realty_object.category": "object?",
          "realty_object.category.code": "string",
          "realty_object.floor": "integer?",
          "realty_object.id": "integer",
          "realty_object.number": "string?",
          "realty_object.product_code": "string?",
          "realty_object.project_code": "string?",
          "realty_object.project_name": "string",
          "realty_object.rooms": "integer?",
          "realty_object.type_title": "string",
          "realty_object.url": "string?",
          "status": "string"
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      // Сохраняем идентификатор оформления сделки для следующих запросов; при ошибке значение сбрасываем
      (function () {
        let body = null;
        try { body = pm.response.json(); } catch (e) { body = null; }
        let found;
        try { found = (function (data) { return data.id; })(body); } catch (e) { found = undefined; }
        if (found !== undefined && found !== null && found !== "") {
          pm.environment.set("dealApplicationId", String(found));
        } else {
          pm.environment.unset("dealApplicationId");
        }
      })();
    language: text/javascript
settings: {}
order: 1000
