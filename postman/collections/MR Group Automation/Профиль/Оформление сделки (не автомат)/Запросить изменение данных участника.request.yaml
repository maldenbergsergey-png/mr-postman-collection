          "user_data.passport_issued_at",
          "user_data.passport_issued_by",
          "user_data.registration_address.full_text",
          "user_data.snils",
          "user_data.updated_dt",
        ],
        types: {
          "client_type": "string",
          "documents": "array",
          "documents.*": "object",
          "documents.*.document_id": "string",
          "documents.*.document_type": "string",
          "documents.*.error_code": "string?",
          "documents.*.file_content_type": "string?",
          "documents.*.file_name": "string?",
          "documents.*.is_not_required": "boolean",
          "documents.*.ocr_status": "string",
          "documents.*.preview_url": "string?",
          "documents.*.recognition_attempt_count": "integer",
          "documents.*.recognition_blocks_progress": "boolean",
          "documents.*.recognition_error_message": "string?",
