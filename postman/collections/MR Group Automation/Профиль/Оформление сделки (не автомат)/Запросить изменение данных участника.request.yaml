$kind: http-request
name: "Запросить изменение данных участника"
description: |-
  Клиент просит менеджера изменить данные участника или переоформить ДБ. Запрос принят:
  заявка уходит в CRM, шаг этапа становится `change_requested`, изменения этапа запрещены.
  Возврата из `change_requested` в приложении нет: клиент уходит в офлайн, дальше с ним работает менеджер.
  Тело пустое. `POST /user/consultation` для этого не используется.

  Только отдельная тестовая заявка. Операция переводит оформление в офлайн и блокирует дальнейшее прохождение этапа.
url: "{{baseUrl}}/deal-application/{{dealApplicationId}}/participant/change-request"
method: POST
headers:
  Accept: "application/json"
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "client_type",
          "documents",
          "documents.*.document_id",
          "documents.*.document_type",
          "documents.*.error_code",
          "documents.*.file_content_type",
          "documents.*.file_name",
          "documents.*.is_not_required",
          "documents.*.ocr_status",
          "documents.*.preview_url",
          "documents.*.recognition_attempt_count",
          "documents.*.recognition_blocks_progress",
          "documents.*.recognition_error_message",
          "documents.*.recognized_fields",
          "documents.*.updated_dt",
          "documents.*.upload_status",
          "documents.*.uploaded_by",
          "documents.*.uploaded_dt",
          "form_preferences.requires_notarial_consent",
          "inn_state",
          "inn_state.inn",
          "inn_state.is_slot_required",
          "inn_state.message",
          "inn_state.source",
          "ocr_warnings",
