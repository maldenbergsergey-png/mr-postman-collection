          "user_profile.passport_series": "string",
          "user_profile.phone": "string",
        },
        openPaths: ["documents.*.recognized_fields"],
      });
      const required = ["dealApplicationId", "bearerToken"];
      const missing = required.filter((key) => !pm.variables.get(key));
      if (missing.length) {
        console.warn("Нужны входные данные: " + missing.join(", "));
        pm.execution.skipRequest();
      }
    language: text/javascript
settings: {}
order: 17000
