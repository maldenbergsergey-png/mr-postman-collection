$kind: http-request
name: Запрос консультации для пользователя (авторизованный)
url: "{{baseUrl}}/user/consultation"
method: POST
headers:
  accept: application/json, text/plain, */*
  accept-language: ru-RU,ru;q=0.9,en-US;q=0.8,en;q=0.7
  baggage: sentry-environment=production,sentry-public_key=92aba965495d84b286ecfb5f960a3bae,sentry-trace_id=e547c7c7ca854fde8193e3515cb2fcae,sentry-sample_rate=1,sentry-transaction=%2Fprojects%2F%3Acode%2F,sentry-sampled=true
  content-type: application/json
  dev-authorization: f5GaD8jxJ8KwEM
  origin: https://stage-superapp.mr-group.ru
  priority: u=1, i
  referer: https://stage-superapp.mr-group.ru/projects/zhk-mira/
  sec-ch-ua: '"Google Chrome";v="141", "Not?A_Brand";v="8", "Chromium";v="141"'
  sec-ch-ua-mobile: ?1
  sec-ch-ua-platform: '"Android"'
  sec-fetch-dest: empty
  sec-fetch-mode: cors
  sec-fetch-site: same-origin
  sentry-trace: e547c7c7ca854fde8193e3515cb2fcae-989671bd3e616dd9-1
  user-agent: Mozilla/5.0 (Linux; Android 6.0; Nexus 5 Build/MRA58N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36
body:
  type: json
  content: |-
    {
        "project_code": "{{projectCode}}",
        "description": "Автоматизированная отправка заявки на консультацию. Автотест",
        "meta": {
            "consents": {
                "consent_documents": {{consentIds}},
                "device_info": [
                    {
                        "name": "Время, часовой пояс",
                        "value": "{{timestamp}}"
                    }
                ]
            },
            "source": {
                "context": "project_page",
                "platform": "web"
            }
        },
        "form": "{{formCode}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("schema", {
        required: [
          "id"
        ],
        types: {
          "id": "string"
        }
      });
    language: text/javascript
  - type: beforeRequest
    code: |-
      //
      // 1) Берем projectsArray из окружения
      //
      let rawProjects = pm.environment.get("projectsArray") || "[]";
      let projects = [];

      try {
        // сначала пытаемся как JSON
        projects = JSON.parse(rawProjects);
      } catch (e) {
        // если это строка через запятую → превращаем в массив
        projects = rawProjects.split(",").map(p => p.trim()).filter(Boolean);
      }

      pm.expect(projects, "projectsArray пуст — нечего выбрать").to.be.an("array").that.is.not.empty;

      //
      // 2) Выбираем случайный проект
      //
      const projectCode = projects[Math.floor(Math.random() * projects.length)];
      pm.environment.set("projectCode", projectCode);
      console.log(`Выбран проект: ${projectCode}`);


      //
      // 3) Загружаем карту formsConsentsMap
      //
      let rawMap = pm.environment.get("formsConsentsMap") || "{}";
      let formsConsentsMap = {};

      try {
        formsConsentsMap = JSON.parse(rawMap);
      } catch (e) {
        pm.expect.fail("formsConsentsMap повреждён — вызови /forms/configs");
      }

      //
      // 4) Допустимые формы консультаций
      //
      const allowedForms = [
        "consultation_boxrooms_parking",
        "consultation_brokeram",
        "consultation_decoration",
        "consultation",
        "consultation_mortgage_calc",
        "consultation_mortgage_manager",
        "consultation_tradein"
      ];

      // выбираем только те, что реально есть в карте
      const availableForms = allowedForms.filter(f => formsConsentsMap[f]);

      pm.expect(availableForms, "Нет доступных консультационных форм").to.be.an("array").that.is.not.empty;

      //
      // 5) Берем рандомную форму
      //
      const formCode = availableForms[Math.floor(Math.random() * availableForms.length)];
      pm.environment.set("formCode", formCode);
      console.log(`Выбрана форма: ${formCode}`);

      //
      // 6) Берем consent_ids для формы
      //
      const consentIds = formsConsentsMap[formCode] || [];
      pm.expect(consentIds, `Для формы '${formCode}' нет consent_ids`).to.be.an("array").that.is.not.empty;

      pm.environment.set("consentIds", JSON.stringify(consentIds));
      console.log(`Документы (${consentIds.length}):`, consentIds);

      //
      // 7) Таймштамп
      //
      pm.environment.set("timestamp", new Date().toISOString());
    language: text/javascript
settings: {}
order: 1000
