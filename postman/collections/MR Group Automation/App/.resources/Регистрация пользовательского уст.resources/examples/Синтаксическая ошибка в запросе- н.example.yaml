$kind: http-example
name: |-
  Синтаксическая ошибка в запросе: неверный JSON, нет обязательного поля, недопустимый тип
  значения и т.п.

  Возможные коды ошибок:

  - `invalid_value` — полученное значение не соответствует заданным ограничениям;
  - `syntax_error` — синтаксическая ошибка в за
request:
  url: "{{baseUrl}}/app/device"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "device_id": "<string>",
        "install_id": "<string>",
        "device_type": "android_google",
        "token": "<string>",
        "active": "<boolean>",
        "meta": {
          "source": {
            "platform": "web",
            "context": "<string>"
          }
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 2000
