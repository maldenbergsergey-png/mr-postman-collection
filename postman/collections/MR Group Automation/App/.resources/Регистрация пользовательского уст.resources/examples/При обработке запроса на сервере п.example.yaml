$kind: http-example
name: |
  При обработке запроса на сервере произошла внутренняя ошибка.

  Возможные коды ошибок:
  - `internal_error` — внутренняя ошибка приложения.
request:
  url: "{{baseUrl}}/app/device"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "device_id": "<string>",
        "install_id": "<string>",
        "device_type": "android_google",
        "token": "<string>",
        "active": "<boolean>",
        "meta": {
          "source": {
            "platform": "web",
            "context": "<string>"
          }
        }
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 3000
