$kind: http-example
name: |
  Минимальные поддерживаемые версии мобильных приложений.
request:
  url: "{{baseUrl}}/app/version"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ios": "<string>",
        "android": "<string>"
      }
order: 1000
