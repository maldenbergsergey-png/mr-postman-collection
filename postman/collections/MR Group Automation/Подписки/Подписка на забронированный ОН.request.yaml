body:
  type: json
  content: |-
    {
        "email": "maldenberg@mail.ru",
        "product_code": "{{product_code}}",
        "form": "{{formCode}}",
        "meta": {
            "consents": {
                "consent_documents": {{consentIds}},
                "phone": "",
                "email": "maldenberg@mail.ru",
                "device_info": [
                    {
                        "name": "Время, часовой пояс",
                        "value": "{{timestamp}}"
                    }
                ]
            }
        }
    }
scripts:
  - type: beforeRequest
    code: |-
      
      // 1) Загружаем карту formCode -> consentIds
      //
      let raw = pm.environment.get("formsConsentsMap") || "{}";
      let formsConsentsMap = {};
      try {
        formsConsentsMap = JSON.parse(raw);
      } catch (e) {
        pm.expect.fail("formsConsentsMap повреждён — сначала выполни /forms/configs");
      }

      //
      // 2) Фиксированный список разрешённых подписочных форм
      //
      const allowedForms = ["subscription"];
      const available = allowedForms.filter(f => formsConsentsMap[f]);

      pm.expect(available, "❗ Нет подписочных форм в formsConsentsMap")
        .to.be.an("array")
        .that.is.not.empty;

      //
      // 3) Выбираем formCode: если уже выставили — не трогаем
      //
      let formCode = pm.environment.get("formCode");

      if (!formCode || !available.includes(formCode)) {
        formCode = available[Math.floor(Math.random() * available.length)];
        pm.environment.set("formCode", formCode);
        console.log(`Выбрана форма подписки: ${formCode}`);
      } else {
        console.log(`♻️ Используем сохранённую форму подписки: ${formCode}`);
      }

      //
      // 4) Берём consentIds
      //
      const consentIds = formsConsentsMap[formCode] || [];
      pm.expect(consentIds, `Для формы '${formCode}' нет consent_ids`).to.be.an("array").that.is.not.empty;

      pm.environment.set("consentIds", JSON.stringify(consentIds));
      console.log(`${formCode} → ${consentIds.length} consent_ids`);

      //
      // 5. Определяем список забронированных ОН

      // URL запроса для получения забронированных объектов:
      const url = `${pm.environment.get("baseUrl")}/realty/objects?booked=true&category=flats&page=1&grid=card&limit=3`;

      console.log("🔄 Получаем список забронированных объектов...");

      pm.sendRequest(
        {
          url: url,
          method: "GET",
          header: {
            "Accept": "application/json",
            // Если нужен токен авторизации - добавь сюда:
            // "Authorization": `Bearer ${pm.environment.get("bearerToken")}`
          }
        },
        function (err, res) {
          if (err) {
            pm.expect.fail("❗ Ошибка запроса realty/objects: " + err);
          }

          let json;
          try {
            json = res.json();
          } catch (e) {
            pm.expect.fail("❗ Ответ realty/objects не JSON");
          }

          pm.expect(json.items, "❗ Нет поля items в ответе").to.be.an("array").that.is.not.empty;

          // Собираем коды квартир
          const codes = json.items
            .map(item => item.code)
            .filter(Boolean);

          pm.expect(codes, "❗ В ответе нет кодов объектов").to.be.an("array").that.is.not.empty;

          // Выбираем случайный product_code
          const productCode = codes[Math.floor(Math.random() * codes.length)];

          // Сохраняем в переменные окружения
          pm.environment.set("bookedRealtyObjects", JSON.stringify(codes));
          pm.environment.set("product_code", productCode);

          console.log(`Найдены объекты:`, codes);
          console.log(`Выбран product_code: ${productCode}`);

        }
      );

      // 

      // 6) timestamp
      //
      pm.environment.set("timestamp", new Date().toISOString());
    language: text/javascript
settings: {}
examples: ./.resources/Подписка на забронированный ОН.resources/examples
