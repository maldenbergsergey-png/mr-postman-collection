$kind: http-request
description: |
  Метод возвращает список ОН на этаже.
url: "{{baseUrl}}/sale/plan/floor/objects?category={{categoryHasPlan}}&building={{buildingHasPlan}}&floor={{floorNumberHasPlan}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: category
    value: "{{categoryHasPlan}}"
    description: (Required) Код корпуса
  - key: building
    value: "{{buildingHasPlan}}"
    description: Код корпуса
  - key: floor
    value: "{{floorNumberHasPlan}}"
    description: (Required) Номер этажа
  - key: section
    value: <integer>
    disabled: true
    description: ID секции
scripts:
  - type: beforeRequest
    code: |-
      // Нужные значения приходят из предыдущих запросов; без них запрос не отправляется
      const missingInputs__ = ["categoryHasPlan", "buildingHasPlan", "floorNumberHasPlan"].filter((n) => !pm.variables.get(n));
      if (missingInputs__.length) {
        console.warn("Запрос пропущен: нет значений для " + missingInputs__.join(", "));
        pm.execution.skipRequest();
      }

      pm.variables.set("schema", {
        required: [
          "*.area",
          "*.booking_type",
          "*.category",
          "*.category.code",
          "*.category.name",
          "*.code",
          "*.discount",
          "*.floor",
          "*.id",
          "*.monthly_payment",
          "*.number",
          "*.number_on_floor",
          "*.plot",
          "*.price",
          "*.project",
          "*.project.brandbook",
          "*.project.business_unit",
          "*.project.code",
          "*.project.id",
          "*.project.image",
          "*.project.is_countryside",
          "*.project.is_premium",
          "*.project.is_private",
          "*.project.is_promoted",
          "*.project.metro_stations",
          "*.project.metro_stations.*.color",
          "*.project.metro_stations.*.distance",
          "*.project.metro_stations.*.id",
          "*.project.metro_stations.*.line",
          "*.project.metro_stations.*.movement_way",
          "*.project.metro_stations.*.name",
          "*.project.name",
          "*.project.title",
          "*.project.description",
          "*.project.marketing_image",
          "*.purchase_type",
          "*.rooms_number",
          "*.status",
          "*.status.code",
          "*.status.name",
          "*.tier_quantity"
        ],
        types: {
          "*.area": "number?",
          "*.booking_type": "string?",
          "*.category": "object",
          "*.category.code": "string",
          "*.category.name": "string",
          "*.code": "string",
          "*.discount": "object?",
          "*.discount.absolute_discount": "number",
          "*.discount.description": "string?",
          "*.discount.is_stock": "boolean",
          "*.discount.meter_price": "number",
          "*.discount.percentage_discount": "number",
          "*.discount.price": "number",
          "*.discount.type": "string",
          "*.floor": "integer?",
          "*.id": "integer",
          "*.monthly_payment": "number?",
          "*.number": "string?",
          "*.number_on_floor": "integer",
          "*.plot": "object?",
          "*.plot.exists": "boolean",
          "*.plot.size": "number?",
          "*.price": "number?",
          "*.project": "object",
          "*.project.brandbook": "string",
          "*.project.business_unit": "string",
          "*.project.code": "string",
          "*.project.id": "integer",
          "*.project.image": "string?",
          "*.project.is_countryside": "boolean",
          "*.project.is_premium": "boolean",
          "*.project.is_private": "boolean",
          "*.project.is_promoted": "boolean",
          "*.project.metro_stations": "array",
          "*.project.metro_stations.*.color": "string?",
          "*.project.metro_stations.*.distance": "integer?",
          "*.project.metro_stations.*.id": "integer",
          "*.project.metro_stations.*.line": "string?",
          "*.project.metro_stations.*.movement_way": "object?",
          "*.project.metro_stations.*.movement_way.icon": "string",
          "*.project.metro_stations.*.movement_way.name": "string",
          "*.project.metro_stations.*.name": "string",
          "*.project.name": "string",
          "*.project.office_class": "object?",
          "*.project.office_class.code": "string",
          "*.project.office_class.description": "string?",
          "*.project.title": "string?",
          "*.project.description": "string?",
          "*.project.marketing_image": "string?",
          "*.purchase_type": "string",
          "*.rooms_number": "integer?",
          "*.status": "object",
          "*.status.code": "string",
          "*.status.name": "string",
          "*.subcategory": "object",
          "*.subcategory.code": "string",
          "*.subcategory.name": "string",
          "*.tier_quantity": "number?"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Список ОН на этаже.resources/examples
order: 4000
