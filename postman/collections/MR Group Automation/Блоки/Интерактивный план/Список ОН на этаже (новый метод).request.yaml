$kind: http-request
description: |
  Метод возвращает список ОН на этаже.
url: "{{baseUrl}}/realty/plan/floor/objects?category={{categoryHasPlan}}&building={{buildingHasPlan}}&floor={{floorNumberHasPlan}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: category
    value: "{{categoryHasPlan}}"
    description: (Required) Код корпуса
  - key: building
    value: "{{buildingHasPlan}}"
    description: Код корпуса
  - key: floor
    value: "{{floorNumberHasPlan}}"
    description: (Required) Номер этажа
  - key: section
    value: <integer>
    disabled: true
    description: ID секции
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "array",
        required: [
          "*.area",
          "*.booking_type",
          "*.category",
          "*.category.code",
          "*.category.name",
          "*.code",
          "*.discount",
          "*.discount.absolute_discount",
          "*.discount.description",
          "*.discount.is_stock",
          "*.discount.meter_price",
          "*.discount.percentage_discount",
          "*.discount.price",
          "*.discount.type",
          "*.floor",
          "*.id",
          "*.monthly_payment",
          "*.number",
          "*.number_on_floor",
          "*.plot",
          "*.plot.exists",
          "*.plot.size",
          "*.price",
          "*.price_disclaimer",
          "*.project",
          "*.project.brandbook",
          "*.project.business_unit",
          "*.project.code",
          "*.project.description",
          "*.project.id",
          "*.project.image",
          "*.project.is_countryside",
          "*.project.is_premium",
          "*.project.is_private",
          "*.project.is_promoted",
          "*.project.marketing_image",
          "*.project.metro_stations",
          "*.project.metro_stations.*.color",
          "*.project.metro_stations.*.distance",
          "*.project.metro_stations.*.id",
          "*.project.metro_stations.*.line",
          "*.project.metro_stations.*.movement_way",
          "*.project.metro_stations.*.movement_way.icon",
          "*.project.metro_stations.*.movement_way.name",
          "*.project.metro_stations.*.name",
          "*.project.name",
          "*.project.office_class.code",
          "*.project.title",
          "*.purchase_type",
          "*.rooms_number",
          "*.status",
          "*.status.code",
          "*.status.name",
          "*.stop_sales",
          "*.subcategory.code",
          "*.subcategory.name",
          "*.tier_quantity",
        ],
        types: {
          "*": "object",
          "*.area": "number?",
          "*.booking_type": "string?",
          "*.category": "object",
          "*.category.code": "string",
          "*.category.name": "string",
          "*.code": "string",
          "*.discount": "object?",
          "*.discount.absolute_discount": "number",
          "*.discount.description": "string?",
          "*.discount.is_stock": "boolean",
          "*.discount.meter_price": "number",
          "*.discount.percentage_discount": "number",
          "*.discount.price": "number",
          "*.discount.type": "string",
          "*.floor": "integer?",
          "*.id": "integer",
          "*.monthly_payment": "number?",
          "*.number": "string?",
          "*.number_on_floor": "integer",
          "*.plot": "object?",
          "*.plot.exists": "boolean",
          "*.plot.size": "number?",
          "*.price": "number?",
          "*.price_disclaimer": "string?",
          "*.project": "object",
          "*.project.brandbook": "string",
          "*.project.business_unit": "string",
          "*.project.code": "string",
          "*.project.description": "string?",
          "*.project.id": "integer",
          "*.project.image": "string?",
          "*.project.is_countryside": "boolean",
          "*.project.is_premium": "boolean",
          "*.project.is_private": "boolean",
          "*.project.is_promoted": "boolean",
          "*.project.marketing_image": "string?",
