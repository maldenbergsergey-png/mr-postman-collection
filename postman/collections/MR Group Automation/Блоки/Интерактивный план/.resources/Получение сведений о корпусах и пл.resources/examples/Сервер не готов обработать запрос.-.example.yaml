$kind: http-example
name: |
  Сервер не готов обработать запрос.

  Возможные коды ошибок:

  - `service_unavailable` — приложение временно недоступно.
request:
  url: "{{baseUrl}}/sale/plan/buildings?category=commercials&project=<string>"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: category
      value: commercials
      description: Фильтр по типу ОН
    - key: project
      value: <string>
      description: Фильтр по коду проекта
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 3000
