$kind: http-example
name: |
  При обработке запроса на сервере произошла внутренняя ошибка.

  Возможные коды ошибок:
  - `internal_error` — внутренняя ошибка приложения.
request:
  url: "{{baseUrl}}/sale/plan/floors?category=commercials&building=<string>&section=<integer>"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: category
      value: commercials
      description: Фильтр по типу ОН
    - key: building
      value: <string>
      description: Код корпуса
    - key: section
      value: <integer>
      description: ID секции
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 2000
