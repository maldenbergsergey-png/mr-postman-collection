    language: text/javascript
  - type: afterResponse
    code: |
      let jsonData;
      jsonData = pm.response.json();

      // --- Фильтруем корпуса, где apartments_count != 0 ---
      const buildingsWithApartments = jsonData.filter(b => b.apartments_count && b.apartments_count !== 0);

      // --- Проверяем, что есть корпуса с квартирами ---
      pm.test("Есть корпуса с квартирами (apartments_count != 0)", function () {
          pm.expect(buildingsWithApartments.length).to.be.above(0);
      });

      // --- Извлекаем только их code ---
      const codes = buildingsWithApartments.map(b => b.code);

      // --- Сохраняем массив кодов корпусов в окружение ---
      pm.environment.set("buildingArray", JSON.stringify(codes));
      console.log("Сохранён список корпусов с квартирами:", codes);

      // --- Выбираем случайный корпус ---
      const randomIndex = Math.floor(Math.random() * codes.length);
      const randomBuilding = codes[randomIndex];

      // --- Сохраняем выбранный корпус в переменную окружения ---
      pm.environment.set("buildingHasPlan", randomBuilding);
      console.log(" Случайно выбран корпус с квартирами:", randomBuilding);

      // --- Проверка, что переменная записана ---
      pm.test("Переменная buildingHasPlan успешно сохранена", function () {
          pm.expect(pm.environment.get("buildingHasPlan")).to.eql(randomBuilding);
      });
    language: text/javascript
