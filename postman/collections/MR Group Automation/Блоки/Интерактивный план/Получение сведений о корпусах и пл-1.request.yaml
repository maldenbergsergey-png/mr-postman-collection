      // const categories = ["commercials", "flats", "offices", "boxrooms", "parkings"];

      // Список доступных категорий
      const categories = ["flats"];

      // Выбираем случайную категорию
      const randomCategory = categories[Math.floor(Math.random() * categories.length)];

      // Сохраняем её в окружение
      pm.environment.set("categoryHasPlan", randomCategory);

      console.log(`Выбрана категория: ${randomCategory}`);
      //_____________________________________________________________________________________________________________

      //Список проектов у которых есть интерактивный план
      const projectsHasPlan = ["zhk-citybay", "cityzen","zhk-slava","symphony-34"];

      // Выбираем случайный проект 
      const randomProject = projectsHasPlan[Math.floor(Math.random() * projectsHasPlan.length)];

      // Сохраняем её в окружение
      pm.environment.set("projectHasPlanCode", randomProject);

      console.log(`Выбран проект: ${randomProject}`);

