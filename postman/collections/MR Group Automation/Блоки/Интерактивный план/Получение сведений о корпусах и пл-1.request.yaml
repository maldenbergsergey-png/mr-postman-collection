$kind: http-request
name: Получение сведений о корпусах и плане, который следует открыть (новый метод)
description: |
  Метод возвращает информацию о корпусах и план, который следует открыть
url: "{{baseUrl}}/realty/plan/buildings?category={{categoryHasPlan}}&project={{projectHasPlanCode}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: category
    value: "{{categoryHasPlan}}"
    description: Фильтр по типу ОН
  - key: project
    value: "{{projectHasPlanCode}}"
    description: Фильтр по коду проекта
