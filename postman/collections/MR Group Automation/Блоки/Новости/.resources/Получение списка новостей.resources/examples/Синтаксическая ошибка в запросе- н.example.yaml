$kind: http-example
name: |-
  Синтаксическая ошибка в запросе: неверный JSON, нет обязательного поля, недопустимый тип
  значения и т.п.

  Возможные коды ошибок:

  - `invalid_value` — полученное значение не соответствует заданным ограничениям;
  - `syntax_error` — синтаксическая ошибка в за
request:
  url: "{{baseUrl}}/news?project[]=<string>&dateFrom=<date>&dateTo=<date>&tags[]=<string>&page=<integer>&limit=<integer>"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: project[]
      value: <string>
      description: Фильтр по коду проектов
    - key: dateFrom
      value: <date>
      description: |
        Фильтр по дате новости, ОТ (включительно).
    - key: dateTo
      value: <date>
      description: |
        Фильтр по дате новости, ДО (включительно).
    - key: tags[]
      value: <string>
      description: |
        Вернуть только те новости, у которых есть **хотя бы одна** из перечисленных меток.
    - key: page
      value: <integer>
      description: Номер страницы для пагинации (по умолчанию = 1)
    - key: limit
      value: <integer>
      description: Количество элементов на странице для пагинации (каждый метод может иметь своё значение по умолчанию)
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 2000
