$kind: http-request
description: |
  Возвращает список новостей. При необходимости список может быть отфильтрован с помощью
  параметров в запросе.
url: "{{baseUrl}}/news"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: project[]
    value: <string>
    disabled: true
    description: Фильтр по коду проектов
  - key: project[]
    value: <string>
    disabled: true
    description: Фильтр по коду проектов
  - key: dateFrom
    value: <date>
    disabled: true
    description: |
      Фильтр по дате новости, ОТ (включительно).
  - key: dateTo
    value: <date>
    disabled: true
    description: |
      Фильтр по дате новости, ДО (включительно).
  - key: tags[]
    value: <string>
    disabled: true
    description: |
      Вернуть только те новости, у которых есть **хотя бы одна** из перечисленных меток.
  - key: tags[]
    value: <string>
    disabled: true
    description: |
      Вернуть только те новости, у которых есть **хотя бы одна** из перечисленных меток.
  - key: page
    value: <integer>
    disabled: true
    description: Номер страницы для пагинации (по умолчанию = 1)
  - key: limit
    value: <integer>
    disabled: true
    description: Количество элементов на странице для пагинации (каждый метод может иметь своё значение по умолчанию)
scripts:
  - type: beforeRequest
    code: |-
      // КОНТРАКТЫ МЕТОДА:

      pm.variables.set("schema", {
        required: [
          "count",
          "items",
          "items.*.code",
          "items.*.date",
          "items.*.image",
          "items.*.project",
          "items.*.project.*.brandbook",
          "items.*.project.*.business_unit",
          "items.*.project.*.code",
          "items.*.project.*.id",
          "items.*.project.*.image",
          "items.*.project.*.is_countryside",
          "items.*.project.*.is_premium",
          "items.*.project.*.is_private",
          "items.*.project.*.is_promoted",
          "items.*.project.*.metro_stations",
          "items.*.project.*.metro_stations.*.color",
          "items.*.project.*.metro_stations.*.distance",
          "items.*.project.*.metro_stations.*.id",
          "items.*.project.*.metro_stations.*.line",
          "items.*.project.*.metro_stations.*.movement_way",
          "items.*.project.*.metro_stations.*.name",
          "items.*.project.*.name",
          "items.*.project.*.title",
          "items.*.teaser",
          "items.*.title",
          "page",
          "page_count"
        ],
        types: {
          "count": "integer",
          "items": "array",
          "items.*.code": "string",
          "items.*.date": "string",
          "items.*.image": "string",
          "items.*.project": "array",
          "items.*.project.*.brandbook": "string",
          "items.*.project.*.business_unit": "string",
          "items.*.project.*.code": "string",
          "items.*.project.*.id": "integer",
          "items.*.project.*.image": "string?",
          "items.*.project.*.is_countryside": "boolean",
          "items.*.project.*.is_premium": "boolean",
          "items.*.project.*.is_private": "boolean",
          "items.*.project.*.is_promoted": "boolean",
          "items.*.project.*.metro_stations": "array",
          "items.*.project.*.metro_stations.*.color": "string?",
          "items.*.project.*.metro_stations.*.distance": "integer?",
          "items.*.project.*.metro_stations.*.id": "integer",
          "items.*.project.*.metro_stations.*.line": "string?",
          "items.*.project.*.metro_stations.*.movement_way": "object?",
          "items.*.project.*.metro_stations.*.movement_way.icon": "string",
          "items.*.project.*.metro_stations.*.movement_way.name": "string",
          "items.*.project.*.metro_stations.*.name": "string",
          "items.*.project.*.name": "string",
          "items.*.project.*.office_class": "object?",
          "items.*.project.*.office_class.code": "string",
          "items.*.project.*.office_class.description": "string?",
          "items.*.project.*.title": "string?",
          "items.*.teaser": "string",
          "items.*.title": "string",
          "page": "integer",
          "page_count": "integer"
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |+
      pm.test("Ответ содержит список новостей", function () {
          let data;
          try {
              data = pm.response.json();
          } catch (e) {
              pm.expect.fail("Ответ не является корректным JSON");
          }

          // Проверяем наличие массива items
          pm.expect(data, "Нет ключа 'items'").to.have.property("items");
          pm.expect(data.items, "'items' должен быть непустым массивом")
              .to.be.an("array").that.is.not.empty;

          // Берём только новости, где есть поле code
          const news = data.items.filter(it => it && typeof it.code === "string" && it.code.trim().length > 0);
          pm.expect(news, "Не найдено ни одной новости с полем 'code'").to.have.lengthOf.above(0);

          // Берём случайную новость
          const randomNews = news[Math.floor(Math.random() * news.length)];

          // Сохраняем её code в переменную окружения
          pm.environment.set("newsCode", randomNews.code);

          // Проверяем, что переменная успешно записана
          pm.test(`В переменную окружения сохранён newsCode = ${randomNews.code}`, function () {
              pm.expect(pm.environment.get("newsCode")).to.be.a("string").and.not.empty;
          });
      });


    language: text/javascript
settings: {}
examples: ./.resources/Получение списка новостей.resources/examples
order: 1000
