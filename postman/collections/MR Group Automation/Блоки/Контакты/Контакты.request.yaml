$kind: http-request
description: |
  Получение контактов ЦКП (центра клиентской поддержки)
url: "{{baseUrl}}/contacts/support"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "items",
          "items.*.name",
          "items.*.type",
          "items.*.value",
        ],
        types: {
          "items": "array",
          "items.*": "object",
          "items.*.icon": "string",
          "items.*.name": "string",
          "items.*.type": "string",
          "items.*.value": "string",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Контакты.resources/examples
order: 1000
