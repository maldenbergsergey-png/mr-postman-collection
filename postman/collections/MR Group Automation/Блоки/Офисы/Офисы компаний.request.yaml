$kind: http-request
description: |
  Получение основных контактов офиса компании MR
url: "{{baseUrl}}/offices/company"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      // КОНТРАКТЫ МЕТОДА
      pm.variables.set("schema", {
        required: [
        ],
        types: {
          "items": "array",
          "items.*.address": "string?",
          "items.*.email": "string?",
          "items.*.latitude": "number?",
          "items.*.longitude": "number?",
          "items.*.name": "string",
          "items.*.phone": "string?",
          "items.*.schedule": "string?"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Офисы компаний.resources/examples
order: 1000
