    code: |
      // КОНТРАКТЫ МЕТОДА
      pm.variables.set("schema", {
        required: [
          "projects",
          "projects.*.brandbook",
          "projects.*.business_unit",
          "projects.*.code",
          "projects.*.id",
          "projects.*.image",
          "projects.*.is_countryside",
          "projects.*.is_premium",
          "projects.*.is_private",
          "projects.*.is_promoted",
          "projects.*.metro_stations",
          "projects.*.metro_stations.*.color",
          "projects.*.metro_stations.*.distance",
          "projects.*.metro_stations.*.id",
          "projects.*.metro_stations.*.line",
          "projects.*.metro_stations.*.movement_way",
          "projects.*.metro_stations.*.name",
          "projects.*.name",
          "projects.*.title",
          "projects.*.address",
          "projects.*.geotag_image",
          "projects.*.latitude",
          "projects.*.longitude",
          "projects.*.offices"
        ],
        types: {
          "projects": "array",
          "projects.*.brandbook": "string",
          "projects.*.business_unit": "string",
          "projects.*.code": "string",
          "projects.*.id": "integer",
          "projects.*.image": "string?",
          "projects.*.is_countryside": "boolean?",
          "projects.*.is_premium": "boolean",
          "projects.*.is_private": "boolean",
          "projects.*.is_promoted": "boolean",
          "projects.*.metro_stations": "array",
          "projects.*.metro_stations.*.color": "string?",
          "projects.*.metro_stations.*.distance": "integer?",
          "projects.*.metro_stations.*.id": "integer",
          "projects.*.metro_stations.*.line": "string?",
          "projects.*.metro_stations.*.movement_way": "object?",
          "projects.*.metro_stations.*.movement_way.icon": "string",
          "projects.*.metro_stations.*.movement_way.name": "string",
          "projects.*.metro_stations.*.name": "string",
          "projects.*.name": "string",
          "projects.*.office_class": "object?",
          "projects.*.office_class.code": "string",
          "projects.*.office_class.description": "string?",
          "projects.*.title": "string?",
          "projects.*.address": "string?",
          "projects.*.geotag_image": "string?",
          "projects.*.latitude": "number?",
          "projects.*.longitude": "number?",
          "projects.*.offices": "array",
          "projects.*.offices.*": "object?",
          "projects.*.offices.*.address": "string?",
          "projects.*.offices.*.email": "string?",
          "projects.*.offices.*.latitude": "number?",
          "projects.*.offices.*.longitude": "number?",
          "projects.*.offices.*.name": "string",
          "projects.*.offices.*.phone": "string?",
          "projects.*.offices.*.schedule": "string?",
          "projects.*.offices.*.type": "object",
          "projects.*.offices.*.type.code": "string",
          "projects.*.offices.*.type.name": "string"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Офис конкретного проекта.resources/examples
