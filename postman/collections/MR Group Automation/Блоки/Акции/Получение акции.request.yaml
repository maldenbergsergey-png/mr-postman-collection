$kind: http-request
description: Получение акций
url: "{{baseUrl}}/promo/{{promoCode}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |
      // Код акции берём из сохранённого списка, а если списка нет - запрашиваем GET /promo.
      // Список акций возвращается массивом (допускаем и вариант с полем items).
      const promoUrl = `${pm.environment.get("baseUrl")}/promo`;

      function pickPromo(codes) {
          let index = parseInt(pm.environment.get("promoIndex") || "0", 10);
          if (!Number.isFinite(index) || index >= codes.length) index = 0;
          pm.environment.set("promoCode", String(codes[index]));
          pm.environment.set("promoIndex", String((index + 1) % codes.length));
          console.log(`Выбрана акция: ${codes[index]}`);
      }

      function extractCodes(body) {
          const list = Array.isArray(body) ? body : (body && Array.isArray(body.items) ? body.items : []);
          return list.map((p) => p && p.code).filter(Boolean);
      }

      let codes = [];
      try { codes = JSON.parse(pm.environment.get("promoArray") || "[]"); } catch (e) { codes = []; }

      if (Array.isArray(codes) && codes.length > 0) {
          pickPromo(codes);
      } else {
          // Запрос выполняется до отправки основного запроса: Postman ждёт завершения pm.sendRequest
          pm.sendRequest({ url: promoUrl, method: "GET", header: { Accept: "application/json" } }, function (err, res) {
              if (err || !res || res.code !== 200) {
                  pm.environment.unset("promoCode");
                  console.warn("Не удалось получить список акций:", err || (res && res.code));
                  pm.execution.skipRequest(); // без кода акции основной запрос не отправляем
                  return;
              }
              let list = [];
              try { list = extractCodes(res.json()); } catch (e) { list = []; }
              if (list.length === 0) {
                  pm.environment.unset("promoCode");
                  console.warn("Список акций пуст - код акции не выбран");
                  pm.execution.skipRequest();
                  return;
              }
              pm.environment.set("promoArray", JSON.stringify(list));
              pickPromo(list);
          });
      }

      // КОНТРАКТЫ МЕТОДА: PromoContent
      pm.variables.set("schema", {
        required: [
          "ad_label",
          "button_app_link",
          "button_text",
          "button_web_link",
          "content",
          "project",
          "project.brandbook",
          "project.business_unit",
          "project.code",
          "project.id",
          "project.image",
          "project.is_countryside",
          "project.is_premium",
          "project.is_private",
          "project.is_promoted",
          "project.metro_stations",
          "project.metro_stations.*.color",
          "project.metro_stations.*.distance",
          "project.metro_stations.*.id",
          "project.metro_stations.*.line",
          "project.metro_stations.*.movement_way",
          "project.metro_stations.*.name",
          "project.name",
          "project.title",
          "promo_expires",
          "promo_image_detail",
          "subtitle",
          "title"
        ],
        types: {
          "ad_label": "string?",
          "button_app_link": "string?",
          "button_text": "string?",
          "button_web_link": "string?",
          "content": "string",
          "project": "object",
          "project.brandbook": "string",
          "project.business_unit": "string",
          "project.code": "string",
          "project.id": "integer",
          "project.image": "string?",
          "project.is_countryside": "boolean",
          "project.is_premium": "boolean",
          "project.is_private": "boolean",
          "project.is_promoted": "boolean",
          "project.metro_stations": "array",
          "project.metro_stations.*.color": "string?",
          "project.metro_stations.*.distance": "integer?",
          "project.metro_stations.*.id": "integer",
          "project.metro_stations.*.line": "string?",
          "project.metro_stations.*.movement_way": "object?",
          "project.metro_stations.*.movement_way.icon": "string",
          "project.metro_stations.*.movement_way.name": "string",
          "project.metro_stations.*.name": "string",
          "project.name": "string",
          "project.office_class": "object?",
          "project.office_class.code": "string",
          "project.office_class.description": "string?",
          "project.title": "string?",
          "promo_expires": "string?",
          "promo_image_detail": "string?",
          "subtitle": "string",
          "title": "string"
        }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      let jsonData;
      jsonData = pm.response.json();

      // --- Сохраняем projectСodePromo в окружение ---
      if (jsonData.project && jsonData.project.code) {
          pm.environment.set("projectCodePromo", jsonData.project.code);
          console.log("💾 Переменная окружения 'projectCodePromo' сохранена:", jsonData.project.code);
          pm.test("project.code сохранён в окружении", function () {
              pm.expect(pm.environment.get("projectCodePromo")).to.eql(jsonData.project.code);
          });
      } else {
          console.warn("⚠️ Поле project.code не найдено в ответе!");
      }
    language: text/javascript
settings: {}
examples: ./.resources/Получение акции.resources/examples
order: 1000
