$kind: http-request
name: "Получение акции по коду (новый метод)"
description: |
  Получение сведений об акции.
url: "{{baseUrl}}/promotions/{{promotionCode}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      // Входные данные приходят из предыдущих запросов или задаются вручную
      const required = ["promotionCode"];
      const absent = required.filter((n) => !pm.variables.get(n));
      if (absent.length) {
        console.warn("Запрос пропущен: нет значений для " + absent.join(", "));
        pm.execution.skipRequest();
      }

      // КОНТРАКТ PromotionsContent
      pm.variables.set("schema", {
        required: [
          "ad_label",
          "button_app_link",
          "button_text",
          "button_web_link",
          "content",
          "project",
          "project.brandbook",
          "project.business_unit",
          "project.code",
          "project.id",
          "project.image",
          "project.is_countryside",
          "project.is_premium",
          "project.is_private",
          "project.is_promoted",
          "project.metro_stations",
          "project.metro_stations.*.color",
          "project.metro_stations.*.distance",
          "project.metro_stations.*.id",
          "project.metro_stations.*.line",
          "project.metro_stations.*.movement_way",
          "project.metro_stations.*.name",
          "project.name",
          "project.title",
          "promo_expires",
          "promo_image_detail",
          "show_consultation",
          "subtitle",
          "title"
        ],
        types: {
          "ad_label": "string?",
          "button_app_link": "string?",
          "button_text": "string?",
          "button_web_link": "string?",
          "content": "string",
          "project": "object",
          "project.brandbook": "string",
          "project.business_unit": "string",
          "project.code": "string",
          "project.id": "integer",
          "project.image": "string?",
          "project.is_countryside": "boolean",
          "project.is_premium": "boolean",
          "project.is_private": "boolean",
          "project.is_promoted": "boolean",
          "project.metro_stations": "array",
          "project.metro_stations.*.color": "string?",
          "project.metro_stations.*.distance": "integer?",
          "project.metro_stations.*.id": "integer",
          "project.metro_stations.*.line": "string?",
          "project.metro_stations.*.movement_way": "object?",
          "project.metro_stations.*.movement_way.icon": "string",
          "project.metro_stations.*.movement_way.name": "string",
          "project.metro_stations.*.name": "string",
          "project.name": "string",
          "project.office_class": "object?",
          "project.office_class.code": "string",
          "project.office_class.description": "string?",
          "project.title": "string?",
          "promo_expires": "string?",
          "promo_image_detail": "string?",
          "show_consultation": "boolean",
          "subtitle": "string",
          "title": "string"
        }
      });
    language: text/javascript
settings: {}
order: 4000
