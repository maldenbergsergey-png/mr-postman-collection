$kind: http-request
description: Получение списка акций
url: "{{baseUrl}}/promo?projectCode={{projectCodePromo}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: projectCode
    value: "{{projectCodePromo}}"
    description: Код проекта
  - key: tags[]
    value: <string>
    disabled: true
    description: |
      Вернуть только те акции, у которых есть **хотя бы одна** из перечисленных меток.
  - key: tags[]
    value: <string>
    disabled: true
    description: |
      Вернуть только те акции, у которых есть **хотя бы одна** из перечисленных меток.
scripts:
  - type: beforeRequest
    code: |-
      // КОНТРАКТЫ МЕТОДА:

      pm.variables.set("schema", {
        required: [
          "*.background_color",
          "*.code",
          "*.promo_expires",
          "*.promo_image",
          "*.subtitle",
          "*.title"
        ],
        types: {
          "*.background_color": "string?",
          "*.code": "string?",
          "*.promo_expires": "string?",
          "*.promo_image": "string?",
          "*.subtitle": "string?",
          "*.title": "string"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Список акций.resources/examples
order: 2000
