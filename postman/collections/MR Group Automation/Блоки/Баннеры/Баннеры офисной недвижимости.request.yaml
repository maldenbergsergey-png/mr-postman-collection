$kind: http-request
description: |
  Возвращает список баннеров для разводящей страницы офисов.
url: "{{baseUrl}}/offices/banners"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      // КОНТРАКТЫ МЕТОДА: 

      pm.variables.set("schema", {
        required: [
          "items",
          "items.*.active_btn_link",
          "items.*.active_btn_text",
          "items.*.active_color",
          "items.*.active_title",
          "items.*.ad_label",
          "items.*.desktop_big_picture",
          "items.*.desktop_normal_picture",
          "items.*.discount_amount",
          "items.*.id",
          "items.*.mobile_picture",
          "items.*.preview_picture",
          "items.*.preview_title",
          "items.*.project",
          "items.*.tablet_picture",
          "items.*.title",
          "items.*.type"
        ],
        types: {
          "items": "array",
          "items.*.active_btn_link": "string?",
          "items.*.active_btn_text": "string?",
          "items.*.active_color": "string",
          "items.*.active_title": "string",
          "items.*.ad_label": "string?",
          "items.*.desktop_big_picture": "string?",
          "items.*.desktop_normal_picture": "string?",
          "items.*.discount_amount": "string?",
          "items.*.id": "integer",
          "items.*.mobile_picture": "string?",
          "items.*.preview_picture": "string",
          "items.*.preview_title": "string",
          "items.*.project": "object?",
          "items.*.project.brandbook": "string",
          "items.*.project.business_unit": "string",
          "items.*.project.code": "string",
          "items.*.project.id": "integer",
          "items.*.project.image": "string?",
          "items.*.project.is_countryside": "boolean",
          "items.*.project.is_premium": "boolean",
          "items.*.project.is_private": "boolean",
          "items.*.project.is_promoted": "boolean",
          "items.*.project.metro_stations": "array",
          "items.*.project.metro_stations.*.color": "string?",
          "items.*.project.metro_stations.*.distance": "integer?",
          "items.*.project.metro_stations.*.id": "integer",
          "items.*.project.metro_stations.*.line": "string?",
          "items.*.project.metro_stations.*.movement_way": "object?",
          "items.*.project.metro_stations.*.movement_way.icon": "string",
          "items.*.project.metro_stations.*.movement_way.name": "string",
          "items.*.project.metro_stations.*.name": "string",
          "items.*.project.name": "string",
          "items.*.project.office_class": "object?",
          "items.*.project.office_class.code": "string",
          "items.*.project.office_class.description": "string?",
          "items.*.project.title": "string?",
          "items.*.project.logo": "string?",
          "items.*.project.metro": "object?",
          "items.*.project.metro.color": "string?",
          "items.*.project.metro.name": "string",
          "items.*.project.metro_distance": "integer?",
          "items.*.project.min_meter_price": "number?",
          "items.*.project.movement_way": "object?",
          "items.*.project.movement_way.icon": "string",
          "items.*.project.movement_way.name": "string",
          "items.*.tablet_picture": "string?",
          "items.*.title": "string",
          "items.*.type": "string"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Баннеры офисной недвижимости.resources/examples
order: 2000
