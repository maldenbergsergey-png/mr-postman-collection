$kind: http-request
name: Список баннеров для разводящей страницы MR Private
description: |
  Получение списка баннеров для страницы MR Private
url: "{{baseUrl}}/banners/private"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "count",
          "items",
          "items.*.id",
          "items.*.image",
          "items.*.image.image_desktop",
          "items.*.image.image_desktop_big",
          "items.*.image.image_mobile",
          "items.*.image.image_tablet",
          "items.*.name",
          "items.*.type",
          "items.*.video",
          "items.*.video.image_preview_desktop",
          "items.*.video.image_preview_mobile",
          "items.*.video.video_desktop",
          "items.*.video.video_mobile",
        ],
        types: {
          "count": "integer",
          "items": "array",
          "items.*": "object",
          "items.*.id": "integer",
          "items.*.image": "object?",
          "items.*.image.image_desktop": "string",
          "items.*.image.image_desktop_big": "string?",
          "items.*.image.image_mobile": "string",
          "items.*.image.image_tablet": "string?",
          "items.*.name": "string",
          "items.*.type": "string",
          "items.*.video": "object?",
          "items.*.video.image_preview_desktop": "string",
          "items.*.video.image_preview_mobile": "string",
          "items.*.video.video_desktop": "string",
          "items.*.video.video_mobile": "string",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Список баннеров для разводящей стр.resources/examples
order: 4000
