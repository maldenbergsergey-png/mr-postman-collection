          "items.*.content_type",
          "items.*.discount_amount",
          "items.*.id",
          "items.*.image",
          "items.*.preview_picture",
          "items.*.preview_title",
          "items.*.project",
          "items.*.title",
          "items.*.type",
          "items.*.video"
        ],
        types: {
          "items": "array?",
          "items.*.active_btn_link": "string?",
          "items.*.active_btn_text": "string?",
          "items.*.active_color": "string",
          "items.*.active_title": "string",
          "items.*.ad_label": "string?",
          "items.*.content_type": "string",
