$kind: http-example
name: |
  При обработке запроса на сервере произошла внутренняя ошибка.

  Возможные коды ошибок:
  - `internal_error` — внутренняя ошибка приложения.
request:
  url: "{{baseUrl}}/decoration?project_code=<string>&product_code=<string>"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: project_code
      value: <string>
      description: Код проекта (не путать с фильтром по проекту). Параметр передается, если метод вызывается со страницы проекта
    - key: product_code
      value: <string>
      description: Код ОН
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 3000
