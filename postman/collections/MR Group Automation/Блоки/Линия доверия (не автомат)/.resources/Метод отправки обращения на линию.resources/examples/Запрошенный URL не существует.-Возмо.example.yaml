$kind: http-example
name: |
  Запрошенный URL не существует.

  Возможные коды ошибок:

  - `not_found` — запрошенный ресурс не найден.
request:
  url: "{{baseUrl}}/hotline/form"
  method: POST
  headers:
    - key: Captcha-Token
      value: <string>
      description: Токен, полученный после прохождения проверки пользователя во внешнем сервисе верификации запросов
    - key: Device-Token
      value: <string>
      description: Константное значение, аналог Captcha-Token для моб. приложений для прохождения проверки (временное решение, будет отключено после разработки варианта проверки запросов на отправку роботом для мобильных приложений)
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "phone": "<string>",
        "name": "<string>",
        "email": "<string>",
        "comment": "<string>"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 4000
