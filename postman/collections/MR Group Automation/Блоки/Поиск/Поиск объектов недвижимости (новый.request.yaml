$kind: http-request
name: Поиск объектов недвижимости (новый метод)
url: "{{baseUrl}}/realty/search?query={{projectName}}"
method: GET
queryParams:
  query: "{{projectName}}"
scripts:
  - type: beforeRequest
    code: |
      // Проверка готовности projectName и длины [3;255] байт UTF-8
      let q = pm.environment.get("projectName");
      if (typeof q !== "string" || !q.trim()) {
        throw new Error('projectName пуст — сначала выполните /realty/projects/{{projectCode}}');
      }
      q = q.trim().replace(/\s+/g, " ");
      pm.environment.set("projectName", q);

      // UTF-8 длина без TextEncoder
      const utf8Len = encodeURI(q).split(/%..|./).length - 1;
      if (utf8Len < 3 || utf8Len > 255) {
        throw new Error(`Длина projectName ${utf8Len} байт — вне допуска [3;255] для ?query=`);
      }
      pm.environment.set("searchQueryLen", String(utf8Len));
      console.log(`→ /realty/search?query="${q}"`);


      // КОНТРАКТЫ МЕТОДА: RealtySearchResults
      pm.variables.set("schema", {
        required: [
          "count",
          "items",
          "items.*.brandbook",
          "items.*.business_unit",
          "items.*.code",
          "items.*.id",
          "items.*.image",
          "items.*.is_countryside",
          "items.*.is_premium",
          "items.*.is_private",
          "items.*.is_promoted",
          "items.*.metro_stations",
          "items.*.metro_stations.*.color",
          "items.*.metro_stations.*.distance",
          "items.*.metro_stations.*.id",
          "items.*.metro_stations.*.line",
          "items.*.metro_stations.*.movement_way",
          "items.*.metro_stations.*.name",
          "items.*.name",
          "items.*.title",
          "items.*.air_3d",
          "items.*.categories",
          "items.*.categories.*.code",
          "items.*.categories.*.name",
          "items.*.categories.*.background_color",
          "items.*.categories.*.description",
          "items.*.categories.*.image",
          "items.*.categories.*.in_sale_object_count",
          "items.*.categories.*.is_main_type",
          "items.*.categories.*.max_area",
          "items.*.categories.*.max_discount",
          "items.*.categories.*.min_area",
          "items.*.categories.*.min_meter_price",
          "items.*.categories.*.min_price",
