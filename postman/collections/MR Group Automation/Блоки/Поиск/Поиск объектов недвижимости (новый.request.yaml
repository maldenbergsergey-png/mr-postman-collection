          "items.*.min_price",
          "items.*.movement_way",
          "items.*.partners",
          "items.*.partners.*.logo",
          "items.*.partners.*.name",
          "items.*.price_table",
          "items.*.price_table.*.filter",
          "items.*.price_table.*.min_area",
          "items.*.price_table.*.min_price",
          "items.*.price_table.*.name",
          "items.*.project_usp",
          "items.*.project_usp.*.icon",
          "items.*.project_usp.*.name",
          "items.*.queues"
        ],
        types: {
          "count": "integer",
          "items": "array",
          "items.*.brandbook": "string",
          "items.*.business_unit": "string",
          "items.*.code": "string",
          "items.*.id": "integer",
          "items.*.image": "string?",
