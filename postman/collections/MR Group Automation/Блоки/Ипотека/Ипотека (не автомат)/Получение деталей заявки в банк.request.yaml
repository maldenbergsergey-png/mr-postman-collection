    code: |-
      // КОНТРАКТ MortgageOfferDetail
      pm.variables.set("schema", {
        required: [
          "amount",
          "application",
          "application.create_date",
          "application.id",
          "application.manager",
          "application.number",
          "application.project",
          "application.project.brandbook",
          "application.project.business_unit",
          "application.project.code",
          "application.project.id",
          "application.project.image",
          "application.project.is_countryside",
          "application.project.is_premium",
          "application.project.is_private",
          "application.project.is_promoted",
          "application.project.metro_stations",
          "application.project.metro_stations.*.color",
          "application.project.metro_stations.*.distance",
          "application.project.metro_stations.*.id",
          "application.project.metro_stations.*.line",
          "application.project.metro_stations.*.movement_way",
          "application.project.metro_stations.*.name",
          "application.project.name",
          "application.project.title",
          "application.status",
          "application.status.code",
          "application.status.name",
