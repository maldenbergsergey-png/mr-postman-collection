          "persons.*.id",
          "persons.*.name",
          "persons.*.patronymic",
          "persons.*.phone",
          "persons.*.role",
          "persons.*.surname",
          "program",
          "rate",
          "reject_reason",
          "status",
          "status.code",
          "status.name"
