          "persons.*.email": "string?",
          "persons.*.id": "integer",
          "persons.*.name": "string",
          "persons.*.patronymic": "string?",
          "persons.*.phone": "string?",
          "persons.*.role": "string",
          "persons.*.surname": "string",
          "program": "string",
          "rate": "number?",
          "reject_reason": "string?",
          "status": "object",
          "status.code": "string",
          "status.name": "string"
