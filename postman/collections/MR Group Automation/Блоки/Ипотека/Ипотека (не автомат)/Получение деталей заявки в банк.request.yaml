          "application.project.metro_stations.*.color": "string?",
          "application.project.metro_stations.*.distance": "integer?",
          "application.project.metro_stations.*.id": "integer",
          "application.project.metro_stations.*.line": "string?",
          "application.project.metro_stations.*.movement_way": "object?",
          "application.project.metro_stations.*.movement_way.icon": "string",
          "application.project.metro_stations.*.movement_way.name": "string",
          "application.project.metro_stations.*.name": "string",
          "application.project.name": "string",
