        types: {
          "amount": "number?",
          "application": "object",
          "application.create_date": "string",
          "application.id": "integer",
          "application.manager": "object?",
          "application.manager.email": "string?",
          "application.manager.name": "string?",
          "application.manager.phone": "string?",
          "application.number": "string",
          "application.project": "object",
          "application.project.brandbook": "string",
          "application.project.business_unit": "string",
          "application.project.code": "string",
          "application.project.id": "integer",
          "application.project.image": "string?",
