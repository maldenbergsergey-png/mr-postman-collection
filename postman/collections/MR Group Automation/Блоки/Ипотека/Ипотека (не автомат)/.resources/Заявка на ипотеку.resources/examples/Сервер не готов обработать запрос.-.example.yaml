$kind: http-example
name: |
  Сервер не готов обработать запрос.

  Возможные коды ошибок:

  - `service_unavailable` — приложение временно недоступно.
request:
  url: "{{baseUrl}}/mortgage/application"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "project": "<string>",
        "code": "<string>",
        "rate": "<number>",
        "payment": "<number>",
        "period_max": "<number>",
        "initial_payment": "<number>",
        "price": "<number>",
        "purchase_id": "<number>"
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 6000
