$kind: http-request
name: Получение списка подтипов ОН для ипотечного калькулятора
description: |
  Получение списка подтипов ОН для ипотечного калькулятора
url: "{{baseUrl}}/mortgage/calc/category?project-code={{projectCode}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: project-code
    value: "{{projectCode}}"
    description: Код проекта
  - key: product-code
    value: <string>
    disabled: true
    description: Код ОН
scripts:
  - type: beforeRequest
    code: |
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "count",
          "items",
          "items.*.code",
          "items.*.max_price",
          "items.*.min_price",
          "items.*.name",
        ],
        types: {
          "count": "integer",
          "items": "array",
          "items.*": "object",
          "items.*.code": "string",
          "items.*.max_price": "number",
          "items.*.min_price": "number",
          "items.*.name": "string",
        },
      });
      // КОНТРАКТЫ МЕТОДА: MortgageCalcCategoryList
    language: text/javascript
settings: {}
examples: ./.resources/Получение списка подтипов ОН для и.resources/examples
order: 3000
