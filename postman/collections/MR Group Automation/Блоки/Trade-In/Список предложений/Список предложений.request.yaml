$kind: http-request
description: |
  Получение списка предложений Trade in
url: "{{baseUrl}}/tradein/offers"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      // КОНТРАКТЫ МЕТОДА: 

      pm.variables.set("schema", {
        required: [
          "offers",
          "offers.*.background_color",
          "offers.*.description",
          "offers.*.font_color",
          "offers.*.image",
          "offers.*.note",
          "offers.*.title"
        ],
        types: {
          "offers": "array",
          "offers.*.background_color": "string",
          "offers.*.description": "string",
          "offers.*.font_color": "string",
          "offers.*.image": "string?",
          "offers.*.note": "string",
          "offers.*.title": "string"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Список предложений.resources/examples
order: 1000
