$kind: http-request
description: |
  Получение списка предложений Trade in
url: "{{baseUrl}}/tradein/offers"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "offers",
          "offers.*.background_color",
          "offers.*.description",
          "offers.*.font_color",
          "offers.*.image",
          "offers.*.note",
          "offers.*.title",
        ],
        types: {
          "offers": "array",
          "offers.*": "object",
          "offers.*.background_color": "string",
          "offers.*.description": "string",
          "offers.*.font_color": "string",
          "offers.*.image": "string?",
          "offers.*.note": "string",
          "offers.*.title": "string",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Список предложений.resources/examples
order: 1000
