$kind: http-request
description: |
  Отправка заявки на оценку квартиры для trade in\
  Метод можно вызвать как для авторизованного пользователя, так и для неавторизованного\
  От этого зависят проверки входных данных
url: "{{baseUrl}}/tradein/form"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "phone": "<string>",
      "name": "<string>",
      "project_code": "<string>",
      "comment": "<string>",
      "realty": {
        "address": "<string>",
        "floor": "<integer>",
        "area": "<number>",
        "rooms_number": 0,
        "price": "<number>"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Заявка на Trade-in.resources/examples
order: 1000
