$kind: http-example
name: |
  Сервер не готов обработать запрос.

  Возможные коды ошибок:

  - `service_unavailable` — приложение временно недоступно.
request:
  url: "{{baseUrl}}/tradein/form"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "phone": "<string>",
        "name": "<string>",
        "project_code": "<string>",
        "comment": "<string>",
        "realty": {
          "address": "<string>",
          "floor": "<integer>",
          "area": "<number>",
          "rooms_number": 0,
          "price": "<number>"
        }
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 8000
