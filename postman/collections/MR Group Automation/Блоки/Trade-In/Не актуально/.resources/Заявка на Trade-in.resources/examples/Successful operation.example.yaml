$kind: http-example
request:
  url: "{{baseUrl}}/tradein/form"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "phone": "<string>",
        "name": "<string>",
        "project_code": "<string>",
        "comment": "<string>",
        "realty": {
          "address": "<string>",
          "floor": "<integer>",
          "area": "<number>",
          "rooms_number": 0,
          "price": "<number>"
        }
      }
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
