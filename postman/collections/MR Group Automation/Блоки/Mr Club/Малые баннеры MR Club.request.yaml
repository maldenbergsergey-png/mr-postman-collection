$kind: http-request
name: "Малые баннеры MR Club"
description: |
  Возвращает список маленьких баннеров для страницы MR Club.
url: "{{baseUrl}}/mrclub/banners/small"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "items",
          "items.*.id",
          "items.*.picture",
          "items.*.title",
        ],
        types: {
          "items": "array",
          "items.*": "object",
          "items.*.ad_label": "string?",
          "items.*.id": "integer",
          "items.*.link": "string?",
          "items.*.picture": "string",
          "items.*.title": "string",
        },
      });
      // КОНТРАКТ MrClubSmallBannersCollection
    language: text/javascript
settings: {}
order: 5000
