$kind: http-request
description: |
  Получение информации по конкретному предложению MR Club
url: "{{baseUrl}}/mrclub/offers/{{offerCode}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |
      // КОНТРАКТЫ МЕТОДА:

      pm.variables.set("schema", {
        required: [
          "best_benefits",
          "best_benefits.id",
          "best_benefits.is_offer",
          "best_benefits.show_action_button",
          "code",
          "image",
          "labels",
          "labels.*.text",
          "name",
          "teaser",
          "ad_label",
          "categories",
          "categories.*.code",
          "categories.*.name",
          "conditions",
          "description",
          "partner",
          "steps",
          "steps.*.description",
          "steps.*.name"
        ],
        types: {
          "best_benefits": "object",
          "best_benefits.id": "string?",
          "best_benefits.is_offer": "boolean",
          "best_benefits.show_action_button": "boolean",
          "code": "string",
          "image": "string",
          "labels": "array",
          "labels.*.text": "string",
          "name": "string",
          "teaser": "string",
          "ad_label": "string?",
          "categories": "array",
          "categories.*.code": "string",
          "categories.*.name": "string",
          "conditions": "string",
          "description": "string",
          "partner": "object",
          "partner.code": "string",
          "partner.description": "string",
          "partner.logo": "string",
          "partner.name": "string",
          "partner.text": "string",
          "steps": "array",
          "steps.*.description": "string?",
          "steps.*.name": "string"
        }
      });
    language: text/javascript
settings: {}
examples: ./.resources/Карточка предложения.resources/examples
order: 3000
