$kind: http-request
description: |
  Иерархический набор ссылок для сайта

  Есть следующие типы меню (slug):

  - desktop_menu — меню для desktop-режиме сайта;
  - top_menu — верхнее меню сайта;
  - sitemap — карта сайта в footer сайта.
url: "{{baseUrl}}/pages/menu"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("contractJsonSchema", {
        "$ref": "#/definitions/SiteMenuPagesListResponse",
        "definitions": {
          "SiteMenuPagesListResponse": {
            "type": "object",
            "required": [
              "pages"
            ],
            "properties": {
              "pages": {
                "type": "array",
                "items": {
                  "$ref": "#/definitions/SiteMenuPagesList"
                }
              }
            }
          },
          "SiteMenuPagesList": {
            "type": "object",
            "required": [
              "children",
              "columnNumber",
              "depthLevel",
              "href",
              "id",
              "name",
              "slug",
              "sort"
            ],
            "properties": {
              "children": {
                "type": "array",
                "items": {
                  "$ref": "#/definitions/SiteMenuPagesList"
                }
              },
              "columnNumber": {
                "type": [
                  "integer",
                  "null"
                ]
              },
              "depthLevel": {
                "type": "integer"
              },
              "href": {
                "type": "string"
              },
              "id": {
                "type": "integer"
              },
              "name": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "sort": {
                "type": "integer"
              }
            }
          }
        }
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Пункты меню для сайта.resources/examples
order: 1000
