          "items.*.categories.*.code": "string",
          "items.*.categories.*.min_meter_price": "number?",
          "items.*.categories.*.min_price": "number?",
          "items.*.metro": "object?",
          "items.*.metro.color": "string?",
          "items.*.metro.name": "string",
          "items.*.metro_distance": "integer?",
