  - type: beforeRequest
    code: |-
      // КОНТРАКТ NavigationProjectsListResponse
      pm.variables.set("schema", {
        required: [
          "items",
          "items.*.brandbook",
          "items.*.business_unit",
          "items.*.code",
          "items.*.id",
          "items.*.image",
          "items.*.is_countryside",
          "items.*.is_premium",
          "items.*.is_private",
          "items.*.is_promoted",
          "items.*.metro_stations",
