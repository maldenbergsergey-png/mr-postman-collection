$kind: http-request
description: |
  Параметры конфигурации.
url: "{{baseUrl}}/site/config"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
        ],
        types: {
          "address": "string",
          "ai_search_enabled": "boolean",
          "email_support": "string",
          "footer_copyright": "string",
          "phone_support": "string",
          "reg_text": "string",
        },
      });
      // КОНТРАКТЫ МЕТОДА:

    language: text/javascript
settings: {}
examples: ./.resources/Параметры конфигурации.resources/examples
order: 1000
