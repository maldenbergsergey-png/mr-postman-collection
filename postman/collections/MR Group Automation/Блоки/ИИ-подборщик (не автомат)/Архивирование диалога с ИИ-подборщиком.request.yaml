$kind: http-request
name: "Архивирование диалога с ИИ-подборщиком"
description: |
  Архивирует активный диалог
url: "{{baseUrl}}/ai-chat/reset"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"204": []});
    language: text/javascript
settings: {}
order: 2000
