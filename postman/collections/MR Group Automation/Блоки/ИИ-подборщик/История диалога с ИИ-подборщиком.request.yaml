$kind: http-request
name: "История диалога с ИИ-подборщиком"
description: |
  Возвращает активный диалог. Всегда 200: нет диалога или
  истёк — dialog: null. Кука visitor_id выдаётся в ответе (Set-Cookie).
url: "{{baseUrl}}/ai-chat/history"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // КОНТРАКТ AiChatHistoryResponse
      pm.variables.set("schema", {
        required: [
          "dialog",
          "is_in_flight"
        ],
        types: {
          "dialog": "object?",
          "dialog.messages": "array",
          "dialog.messages.*.content": "string",
          "dialog.messages.*.created_dt": "string",
          "dialog.messages.*.filters": "object",
          "dialog.messages.*.filters.additional_windows": "array",
          "dialog.messages.*.filters.additional_windows.*": "string",
          "dialog.messages.*.filters.area_max": "number",
          "dialog.messages.*.filters.area_min": "number",
          "dialog.messages.*.filters.building": "array",
          "dialog.messages.*.filters.building.*": "string",
          "dialog.messages.*.filters.category": "string",
          "dialog.messages.*.filters.configuration": "array",
          "dialog.messages.*.filters.configuration.*": "string",
          "dialog.messages.*.filters.decoration": "array",
          "dialog.messages.*.filters.decoration.*": "string",
          "dialog.messages.*.filters.features": "array",
          "dialog.messages.*.filters.features.*": "string",
          "dialog.messages.*.filters.floor_max": "integer",
          "dialog.messages.*.filters.floor_min": "integer",
          "dialog.messages.*.filters.glazing_type": "array",
          "dialog.messages.*.filters.glazing_type.*": "string",
          "dialog.messages.*.filters.glazing_typology": "array",
          "dialog.messages.*.filters.glazing_typology.*": "string",
          "dialog.messages.*.filters.has_kitchen": "boolean",
          "dialog.messages.*.filters.is_premium": "boolean",
          "dialog.messages.*.filters.layout_options": "array",
          "dialog.messages.*.filters.layout_options.*": "string",
          "dialog.messages.*.filters.place": "array",
          "dialog.messages.*.filters.place.*": "string",
          "dialog.messages.*.filters.price_max": "number",
          "dialog.messages.*.filters.price_meter_max": "number",
          "dialog.messages.*.filters.price_meter_min": "number",
          "dialog.messages.*.filters.price_min": "number",
          "dialog.messages.*.filters.private_filter": "boolean",
          "dialog.messages.*.filters.project": "array",
          "dialog.messages.*.filters.project.*": "string",
          "dialog.messages.*.filters.region": "array",
          "dialog.messages.*.filters.region.*": "string",
          "dialog.messages.*.filters.release": "array",
          "dialog.messages.*.filters.release.*": "string",
          "dialog.messages.*.filters.resale": "boolean",
          "dialog.messages.*.filters.rooms": "array",
          "dialog.messages.*.filters.rooms.*": "integer",
          "dialog.messages.*.filters.sort": "string",
          "dialog.messages.*.filters.tier_quantity": "array",
          "dialog.messages.*.filters.tier_quantity.*": "integer",
          "dialog.messages.*.filters.unique_format": "array",
          "dialog.messages.*.filters.unique_format.*": "string",
          "dialog.messages.*.filters.views_from_window": "array",
          "dialog.messages.*.filters.views_from_window.*": "string",
          "dialog.messages.*.has_more": "boolean",
          "dialog.messages.*.intent": "string",
          "dialog.messages.*.lot_count": "integer",
          "dialog.messages.*.lots": "array",
          "dialog.messages.*.lots.*.area": "number?",
          "dialog.messages.*.lots.*.building_deadline": "string?",
          "dialog.messages.*.lots.*.code": "string",
          "dialog.messages.*.lots.*.floor": "integer?",
          "dialog.messages.*.lots.*.floors_number": "integer?",
          "dialog.messages.*.lots.*.functional_layout": "string?",
          "dialog.messages.*.lots.*.metro": "object?",
          "dialog.messages.*.lots.*.metro.color": "string?",
          "dialog.messages.*.lots.*.metro.distance": "integer?",
          "dialog.messages.*.lots.*.metro.id": "integer",
          "dialog.messages.*.lots.*.metro.line": "string?",
          "dialog.messages.*.lots.*.metro.movement_way": "object?",
          "dialog.messages.*.lots.*.metro.movement_way.icon": "string",
          "dialog.messages.*.lots.*.metro.movement_way.name": "string",
          "dialog.messages.*.lots.*.metro.name": "string",
          "dialog.messages.*.lots.*.price": "number",
          "dialog.messages.*.lots.*.project_name": "string?",
          "dialog.messages.*.lots.*.rooms_number": "integer?",
          "dialog.messages.*.role": "string",
          "dialog.messages.*.status": "string",
          "dialog.title": "string?",
          "is_in_flight": "boolean"
        }
      });
    language: text/javascript
settings: {}
order: 2000
