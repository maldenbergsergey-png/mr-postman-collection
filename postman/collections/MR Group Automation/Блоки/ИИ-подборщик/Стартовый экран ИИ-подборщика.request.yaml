$kind: http-request
name: "Стартовый экран ИИ-подборщика"
description: |
  Предоставляет текст приветствия и список популярных запросов
url: "{{baseUrl}}/ai-chat/starters"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("expectedResponse", {"200": ["application/json"]});
      pm.variables.set("schema", {
        rootType: "object",
        required: [
          "suggestions",
          "suggestions.*.text",
          "welcome",
        ],
        types: {
          "suggestions": "array",
          "suggestions.*": "object",
          "suggestions.*.text": "string",
          "welcome": "string?",
        },
      });
      // КОНТРАКТ AiChatStartersResponse
    language: text/javascript
settings: {}
order: 1000
