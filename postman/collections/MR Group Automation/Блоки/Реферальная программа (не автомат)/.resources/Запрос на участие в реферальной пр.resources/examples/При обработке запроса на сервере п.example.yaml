$kind: http-example
name: |
  При обработке запроса на сервере произошла внутренняя ошибка.

  Возможные коды ошибок:
  - `internal_error` — внутренняя ошибка приложения.
request:
  url: "{{baseUrl}}/referral/participation/requests"
  method: POST
  headers:
    - key: Captcha-Token
      value: <string>
      description: Токен, полученный после прохождения проверки пользователя во внешнем сервисе верификации запросов
    - key: Device-Token
      value: <string>
      description: Константное значение, аналог Captcha-Token для моб. приложений для прохождения проверки (временное решение, будет отключено после разработки варианта проверки запросов на отправку роботом для мобильных приложений)
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "meta": {
          "consents": {
            "consent_documents": [
              "<string>",
              "<string>"
            ],
            "phone": "+72720862415",
            "email": "<string>"
          },
          "source": {
            "platform": "web",
            "context": "<string>"
          }
        },
        "data": {
          "name": "<string>",
          "phone": "+71879289426",
          "loyalty_card": "<string>",
          "project_code": "<string>"
        }
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          },
          {
            "code": "<string>",
            "detail": "<string>",
            "title": "<string>",
            "source": {
              "pointer": "<string>"
            }
          }
        ],
        "message": "<string>"
      }
order: 5000
